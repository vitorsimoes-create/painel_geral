<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contas a Receber — MC MOTO</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; background:#f2f4f7; margin:0; padding:20px; color:#222; }
  h1 { background:#065f46; color:#fff; padding:14px 18px; border-radius:6px; font-size:18px; margin:0 0 6px; }
  .sub { font-size:12px; color:#666; margin-bottom:16px; }
  .barra-controles { display:flex; align-items:center; gap:14px; background:#fff; border-radius:8px; padding:10px 16px; box-shadow:0 1px 3px rgba(0,0,0,.12); margin-bottom:18px; font-size:13px; flex-wrap:wrap; }
  .modo-btn { padding:6px 16px; border:1px solid #e2e8f0; border-radius:20px; background:#fff; cursor:pointer; font-size:12px; font-weight:bold; color:#64748b; }
  .modo-btn.ativo { background:#065f46; border-color:#065f46; color:#fff; }
  .cards { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
  .card { background:#fff; border-radius:8px; padding:12px 16px; box-shadow:0 1px 3px rgba(0,0,0,.12); min-width:170px; flex:1; }
  .card label { display:block; font-size:11px; color:#666; margin-bottom:4px; }
  .card .calc { font-weight:bold; font-size:19px; color:#1f4e78; }
  .card.vencida .calc { color:#c00000; }
  .card.ate30 .calc { color:#a15c00; }
  .card.futura .calc { color:#0a7a25; }
  .card.pago .calc { color:#0a7a25; }
  .grafico { background:#fff; border-radius:8px; padding:14px 16px; box-shadow:0 1px 3px rgba(0,0,0,.12); margin-bottom:20px; }
  .grafico h2 { font-size:13px; margin:0 0 10px; color:#444; }
  .gbar { display:flex; align-items:center; gap:8px; margin-bottom:5px; font-size:11px; }
  .gbar .glabel { width:70px; color:#666; text-align:right; flex-shrink:0; }
  .gbar .gtrack { flex:1; background:#f1f5f9; border-radius:3px; height:16px; }
  .gbar .gfill { height:100%; border-radius:3px; background:#065f46; min-width:2px; }
  .gbar.vencida .gfill { background:#c00000; }
  table { width:100%; border-collapse:collapse; background:#fff; font-size:12px; }
  th, td { padding:7px 10px; text-align:right; border-bottom:1px solid #eee; white-space:nowrap; }
  th { background:#065f46; color:#fff; font-size:10px; text-transform:uppercase; position:sticky; top:0; }
  td:first-child, th:first-child { text-align:left; white-space:normal; }
  tr.vencida td { background:#fef2f2; }
  .pill { display:inline-block; font-size:10px; font-weight:bold; padding:1px 7px; border-radius:10px; }
  .pill.vencida { background:#fee2e2; color:#991b1b; }
  .pill.ate30 { background:#fef3c7; color:#92400e; }
  .pill.futura { background:#dcfce7; color:#166534; }
  .tabela-wrap { background:#fff; border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.12); overflow:hidden; margin-bottom:24px; max-height:560px; overflow-y:auto; }
  details { background:#fff; border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.12); margin-bottom:8px; overflow:hidden; }
  details summary { cursor:pointer; padding:10px 14px; font-size:13px; font-weight:bold; color:#065f46; display:flex; justify-content:space-between; align-items:center; user-select:none; gap:12px; }
  details summary .mes-meta { font-size:11px; color:#888; font-weight:normal; }
  details .det-body { max-height:420px; overflow-y:auto; }
  .footer-note { font-size:11px; color:#888; margin-top:6px; }
  .sem-dados { padding:20px; text-align:center; color:#0a7a25; background:#e6f4ea; border-radius:8px; font-weight:bold; }
</style>
</head>
<body>
<h1>💵 Contas a Receber — MC MOTO</h1>
<div class="sub" id="gerado-em"></div>
<div class="barra-controles">
  <button id="modo-aberto" class="modo-btn ativo" onclick="setModo('aberto')">Em aberto</button>
  <button id="modo-pago" class="modo-btn" onclick="setModo('pago')">Recebidas (últimos 12 meses)</button>
</div>
<div class="cards" id="kpis"></div>
<div class="grafico"><h2 id="titulo-grafico"></h2><div id="grafico-barras"></div></div>
<div id="detalhe"></div>
<div class="footer-note" id="nota-rodape"></div>
<script>
const DADOS = {"abertos":[],"pagosMesCliente":[],"pagosMeses":{},"clientes":{},"geradoEm":"01/10/2026 09:01"};

function fmt(n){ return 'R$ ' + Number(n).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtData(iso){ return iso ? iso.split('-').reverse().join('/') : '—'; }
function hojeISO(){ return new Date().toISOString().slice(0,10); }
function classifica(vencISO, hoje, mais30){
  if(vencISO < hoje) return 'vencida';
  if(vencISO < mais30) return 'ate30';
  return 'futura';
}
function nomeCli(id){ return DADOS.clientes[id]||('Cliente '+id); }
let modoAtual='aberto';
function setModo(m){
  modoAtual=m;
  document.getElementById('modo-aberto').classList.toggle('ativo', m==='aberto');
  document.getElementById('modo-pago').classList.toggle('ativo', m==='pago');
  renderizar();
}
function renderBarras(porMes, comVencidas){
  const meses=Object.keys(porMes).filter(k=>k!=='Vencidas').sort();
  const tetoData=new Date(); tetoData.setMonth(tetoData.getMonth()+12);
  const teto=tetoData.toISOString().slice(0,7);
  const limite=meses.filter(k=>k<=teto).slice(0,13);
  const apos=meses.filter(k=>!limite.includes(k)).reduce((s,k)=>s+porMes[k],0);
  const barras=[];
  if(comVencidas && porMes['Vencidas']) barras.push(['Vencidas', porMes['Vencidas'], true]);
  limite.forEach(k=>{ const [a,m]=k.split('-'); barras.push([m+'/'+a.slice(2), porMes[k], false]); });
  if(apos>0) barras.push(['Após 12m', apos, false]);
  const max=Math.max(...barras.map(b=>b[1]), 1);
  document.getElementById('grafico-barras').innerHTML=barras.map(([lbl,val,isVenc])=>
    '<div class="gbar'+(isVenc?' vencida':'')+'"><div class="glabel">'+lbl+'</div>'+
    '<div class="gtrack"><div class="gfill" style="width:'+Math.max(2,Math.round(val/max*100))+'%"></div></div>'+
    '<div style="width:110px;flex-shrink:0;font-weight:bold;color:#444">'+fmt(val)+'</div></div>'
  ).join('');
}
function renderizar(){
  document.getElementById('gerado-em').textContent='Gerado em '+DADOS.geradoEm+' · banco mc_moto';
  const det=document.getElementById('detalhe');
  const nota=document.getElementById('nota-rodape');
  const hoje=hojeISO();
  const mais30=new Date(Date.now()+30*86400000).toISOString().slice(0,10);

  if(modoAtual==='aberto'){
    document.getElementById('titulo-grafico').textContent='Saldo a receber por mês de vencimento';
    const titulos=DADOS.abertos;
    let tot=0, venc=0, a30=0, fut=0;
    const porMes={};
    titulos.forEach(t=>{
      tot+=t.saldo;
      const cls=classifica(t.venc, hoje, mais30);
      if(cls==='vencida'){ venc+=t.saldo; porMes['Vencidas']=(porMes['Vencidas']||0)+t.saldo; }
      else{
        if(cls==='ate30') a30+=t.saldo; else fut+=t.saldo;
        porMes[t.venc.slice(0,7)]=(porMes[t.venc.slice(0,7)]||0)+t.saldo;
      }
    });
    document.getElementById('kpis').innerHTML=
      '<div class="card"><label>Total em aberto</label><div class="calc">'+fmt(tot)+'</div></div>'+
      '<div class="card vencida"><label>Vencidas</label><div class="calc">'+fmt(venc)+'</div></div>'+
      '<div class="card ate30"><label>Vencem em 30 dias</label><div class="calc">'+fmt(a30)+'</div></div>'+
      '<div class="card futura"><label>Futuras (&gt;30 dias)</label><div class="calc">'+fmt(fut)+'</div></div>';
    renderBarras(porMes, true);
    if(titulos.length===0){
      det.innerHTML='<div class="sem-dados">✅ Nenhum título a receber em aberto.</div>';
      nota.textContent='';
      return;
    }
    const linhas=titulos.slice().sort((a,b)=>a.venc<b.venc?-1:1);
    const rows=linhas.map(t=>{
      const cls=classifica(t.venc,hoje,mais30);
      return '<tr class="'+(cls==='vencida'?'vencida':'')+'">'+
        '<td>'+nomeCli(t.cli)+' <span style="color:#94a3b8;font-size:10px">(#'+t.cli+')</span></td>'+
        '<td>'+(t.doc||'—')+(t.nf?' / NF '+t.nf:'')+'</td>'+
        '<td>'+fmtData(t.emissao)+'</td>'+
        '<td>'+fmtData(t.venc)+'</td>'+
        '<td><span class="pill '+cls+'">'+(cls==='vencida'?'Vencida':cls==='ate30'?'≤ 30 dias':'Futura')+'</span></td>'+
        '<td><b>'+fmt(t.saldo)+'</b></td></tr>';
    }).join('');
    det.innerHTML='<div class="tabela-wrap"><table><thead><tr><th>Cliente</th><th>Documento</th><th>Emissão</th><th>Vencimento</th><th>Situação</th><th>Saldo</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    nota.textContent='Títulos em aberto (saldo líquido de recebimentos parciais), ordenados por vencimento. A classificação vencida/30 dias/futura é recalculada contra a data em que você está vendo a página; os valores refletem a última geração.';
  }else{
    document.getElementById('titulo-grafico').textContent='Valor recebido por mês (últimos 12 meses)';
    const tot=Object.values(DADOS.pagosMeses).reduce((s,v)=>s+v,0);
    const nTitulos=DADOS.pagosMesCliente.reduce((s,c)=>s+c[3],0);
    const clientesDistintos=new Set(DADOS.pagosMesCliente.map(c=>c[1])).size;
    document.getElementById('kpis').innerHTML=
      '<div class="card pago"><label>Total recebido (12 meses)</label><div class="calc">'+fmt(tot)+'</div></div>'+
      '<div class="card"><label>Títulos recebidos</label><div class="calc">'+nTitulos.toLocaleString('pt-BR')+'</div></div>'+
      '<div class="card"><label>Clientes</label><div class="calc">'+clientesDistintos+'</div></div>';
    renderBarras(DADOS.pagosMeses, false);

    // agrupa por mes (mais recente primeiro); dentro de cada mes, clientes por valor desc
    const porMes={};
    DADOS.pagosMesCliente.forEach(([mes,cli,valor,n])=>{ (porMes[mes]=porMes[mes]||[]).push([cli,valor,n]); });
    const mesesOrd=Object.keys(porMes).sort().reverse();
    const mesAtual=hoje.slice(0,7);
    const MESES_PT=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    det.innerHTML=mesesOrd.map(mk=>{
      const linhas=porMes[mk].slice().sort((a,b)=>b[1]-a[1]);
      const totalMes=linhas.reduce((s,l)=>s+l[1],0);
      const nTitMes=linhas.reduce((s,l)=>s+l[2],0);
      const [a,m]=mk.split('-');
      const rotulo=MESES_PT[parseInt(m,10)-1]+'/'+a;
      const rows=linhas.map(l=>'<tr>'+
        '<td>'+nomeCli(l[0])+' <span style="color:#94a3b8;font-size:10px">(#'+l[0]+')</span></td>'+
        '<td>'+l[2].toLocaleString('pt-BR')+'</td>'+
        '<td><b>'+fmt(l[1])+'</b></td></tr>').join('');
      return '<details'+(mk===mesAtual?' open':'')+'>'+
        '<summary><span>'+rotulo+' <span class="mes-meta">· '+linhas.length+' cliente(s) · '+nTitMes.toLocaleString('pt-BR')+' título(s)</span></span><span>'+fmt(totalMes)+'</span></summary>'+
        '<div class="det-body"><table><thead><tr><th>Cliente</th><th>Títulos recebidos</th><th>Total recebido no mês</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
        '</details>';
    }).join('');
    nota.textContent='Títulos quitados (situação Q) com pagamento nos últimos 12 meses, agrupados por mês de recebimento e, dentro de cada mês, por cliente (maior valor primeiro). Clique num mês para expandir/recolher.';
  }
}
renderizar();
</script>
</body>
</html>
