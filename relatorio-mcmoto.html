 tbody th{position:sticky;left:0;background:#fff;text-align:left;font-weight:600;color:#334155;z-index:1;
          border-right:1px solid #e2e8f0}
 tr.grupo th,tr.grupo td{background:#f1f5f9;font-weight:700;color:#1e293b}

 .tagf{background:#dbeafe;color:#1e40af;font-size:9px;padding:1px 6px;border-radius:8px;font-weight:700}
 .tagv{background:#fce7f3;color:#9d174d;font-size:9px;padding:1px 6px;border-radius:8px;font-weight:700}
 .tagp{background:#fef3c7;color:#92400e;font-size:9px;padding:1px 5px;border-radius:8px;margin-left:5px}

<h1>📋 Relatório Gerencial — MC MOTO</h1>
<div class="sub" id="ger"></div>

<div class="barra">
  <span id="uni-box" style="display:none;align-items:center;gap:6px">
    <b>Unidade:</b><span id="uni-btns" style="display:flex;gap:5px"></span>
    <span style="width:1px;height:20px;background:#e2e8f0"></span>
  </span>
  <b>Meses:</b>
  <button class="btn" onclick="setN(6)">6</button>
  <button class="btn" onclick="setN(12)">12</button>
  <button class="btn" onclick="setN(24)">24</button>
  <span style="width:1px;height:20px;background:#e2e8f0"></span>
  <button class="btn" onclick="repetirMesAnterior()">Repetir mês anterior</button>
  <button class="btn" onclick="exportar()">Exportar lançamentos</button>
  <span style="flex:1"></span>
  <span style="font-size:11px;color:#94a3b8">Campos em amarelo são digitados por você</span>
</div>

<div class="barra" style="margin-bottom:10px">
  <b>Visão:</b>
  <button class="btn" id="v-rel" onclick="setVisao('rel')">Relatório</button>
  <button class="btn" id="v-desp" onclick="setVisao('desp')">Despesas por centro</button>
  <span id="desp-mes-box" style="display:none;align-items:center;gap:8px">
    <span style="width:1px;height:20px;background:#e2e8f0"></span>
    <b>Mês:</b><select id="desp-mes" onchange="render()" style="padding:5px 9px;border:1px solid #cbd5e1;border-radius:6px"></select>
  </span>
</div>
<div class="wrap" id="wrap-rel"><table id="tbl"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
<div class="wrap" id="wrap-desp" style="display:none"><table><thead><tr>
  <th style="text-align:left">Centro de custo</th><th>Natureza</th><th>Vai para</th><th>Valor</th><th>% do total</th>
</tr></thead><tbody id="desp-body"></tbody></table></div>
<div class="nota" id="nota"></div>

<dialog id="dlg">
  <div style="font-weight:700;margin-bottom:4px">Alíquotas sobre a venda</div>
  <div style="font-size:12px;color:#64748b;margin-bottom:12px">Aplicadas sobre as vendas totais de cada mês.</div>
  <div id="dlg-body"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
    <button class="btn" onclick="document.getElementById('dlg').close()">Cancelar</button>
    <button class="btn" style="background:#1e293b;color:#fff;border-color:#1e293b" onclick="salvarAliq()">Salvar</button>
  </div>
</dialog>

const LS_MAN='rel_manual_'+EMP, LS_ALIQ='rel_aliq_'+EMP, LS_N='rel_n_'+EMP;
const fmt=n=>(n<0?'-':'')+'R$ '+Math.abs(Number(n||0)).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});

/* Unidades em foco. A SEVEN tem 3; a MC MOTO tem uma so e o seletor nem aparece. */
function unidades(){
  const todas=D.unidades.map(function(u){return u[0]});
  let sel=null;
  try{ sel=JSON.parse(localStorage.getItem(LS_UNI)||'null'); }catch(e){ sel=null; }
  if(!Array.isArray(sel)) return todas;
  const m=sel.filter(function(u){return todas.indexOf(u)>=0});
  return m.length?m:todas;
}
function toggleUni(u){
  const todas=D.unidades.map(function(x){return x[0]});
  let sel=unidades().slice();
  const i=sel.indexOf(u);
  if(i>=0){ if(sel.length>1) sel.splice(i,1); } else sel.push(u);
  localStorage.setItem(LS_UNI,JSON.stringify(todas.filter(function(x){return sel.indexOf(x)>=0})));
  render();
}
function umaUnidade(){ return unidades().length===1 ? unidades()[0] : null; }
function rotUnidades(){
  const sel=unidades();
  if(sel.length===D.unidades.length) return 'todas as unidades';
  return D.unidades.filter(function(u){return sel.indexOf(u[0])>=0})
                   .map(function(u){return u[1]}).join(' + ');
}
/* Soma o fluxo das unidades marcadas. */
function fluxoMes(ym){
  const t={vAvista:0,vAprazo:0,cmv:0,comissao:0,frete:0,compras:0,itensGirados:0};
  unidades().forEach(function(u){
    const f=(D.fluxo[u]||{})[ym]; if(!f) return;
    Object.keys(t).forEach(function(k){ t[k]+=f[k]||0; });
  });
  return t;
}
/* Contas do mes vindas do SISTEMA (centros de custo), somando as unidades marcadas. */
function contasMes(ym){
  const t={comissao:0,premio:0,frete:0,impostos:0,despFin:0,fixa:0,variavel:0};
  unidades().forEach(function(u){
    const c=(D.contas[u]||{})[ym]; if(!c) return;
    Object.keys(t).forEach(function(k){ t[k]+=c[k]||0; });
    t.despFin += ((D.despFinJuros[u]||{})[ym]||0);   // juros pagos
  });
  t.recFin=0;
  unidades().forEach(function(u){ t.recFin+=((D.recFin[u]||{})[ym]||0); });
  return t;
}
/* Detalhe por centro, para a aba de despesas. */
function detalheMes(ym){
  const out={};
  unidades().forEach(function(u){
    const c=(D.contas[u]||{})[ym]; if(!c||!c.detalhe) return;
    Object.keys(c.detalhe).forEach(function(nome){
      const d=c.detalhe[nome];
      const k=nome+'||'+d.n;
      out[k]=out[k]||{nome:nome,n:d.n,l:d.l,v:0};
      out[k].v+=d.v;
    });
  });
  return Object.keys(out).map(function(k){return out[k]}).sort(function(a,b){return b.v-a.v});
}
/* Posicao: soma as unidades. Inadimplencia e recalculada sobre o total, nunca somada. */
function posMes(ym, corrente){
  const t={estoque:0,itensEstoque:0,aPagar:0,aReceber:0,vencido:0,temPos:false,atrasado:null};
  unidades().forEach(function(u){
    const p = corrente ? (D.posicaoHoje[u]||{}) : (((D.historico[u]||{})[ym])||{});
    if(!Object.keys(p).length) return;
    t.temPos=true;
    t.estoque+=p.estoque||0; t.itensEstoque+=p.itensEstoque||0;
    t.aPagar+=p.aPagar||0; t.aReceber+=p.aReceber||0;
    t.vencido+=(p.aReceber||0)*((p.inadimplencia||0)/100);
    if(p.atrasado) t.atrasado=p.fechadoEm;
  });
  t.inadimplencia = t.aReceber>0 ? t.vencido/t.aReceber*100 : null;
  return t;
}
/* Lancamentos manuais sao POR UNIDADE. Com varias marcadas os campos viram
   somatorio so-leitura — editar um numero que e a soma de tres nao faria sentido. */
function manU(u){ try{return (JSON.parse(localStorage.getItem(LS_MAN)||'{}')[u])||{}}catch(e){return{}} }
function vMan(ym,campo){
  let t=0;
  unidades().forEach(function(u){
    const m=manU(u)[ym]; if(m&&m[campo]!=null) t+=+m[campo];
  });
  return t;
}
function man(){ try{return JSON.parse(localStorage.getItem(LS_MAN)||'{}')}catch(e){return{}} }
function setMan(o){ localStorage.setItem(LS_MAN,JSON.stringify(o)); }
function aliq(){ try{return Object.assign({},ALIQ_PADRAO,JSON.parse(localStorage.getItem(LS_ALIQ)||'{}'))}catch(e){return ALIQ_PADRAO} }
function v(ym,campo){ return vMan(ym,campo); }
function setV(ym,campo,val){
  const u=umaUnidade(); if(!u) return;          // so edita com UMA unidade em foco
  const m=man(); const mu=(m[u]=m[u]||{});
  (mu[ym]=mu[ym]||{})[campo]=(val===''?null:+val);
  setMan(m); render();
}
function setN(n){ N=n; localStorage.setItem(LS_N,n); render(); }

/* Calcula todas as linhas de um mes. Fluxo vem do banco; posicao vem do fechamento
   do dia 1 (mes fechado) ou da foto de hoje (mes corrente). */
function calc(ym, corrente){
  const f=fluxoMes(ym);
  const ct=contasMes(ym);
  const pos = posMes(ym, corrente);
  const vAv=f.vAvista||0, vAp=f.vAprazo||0, tot=vAv+vAp;
  /* Comissao, premio, frete, imposto e juros vem do SISTEMA (pagos no mes). */
  const comissao=ct.comissao, premio=ct.premio, frete=ct.frete;
  const impTot=ct.impostos, despFin=ct.despFin, recFin=ct.recFin;
  const mc=tot-(f.cmv||0)-comissao-premio-frete-impTot;
  const fixo=ct.fixa;
  const variavel=ct.variavel;
  const resultado=mc-fixo-variavel-despFin+recFin;
  const capital=v(ym,'capital'), imob=v(ym,'imobilizado');
  const caixa = v(ym,'caixa');
  const ativos=(pos.estoque||0)+(pos.aReceber||0)+caixa+imob;
  const passivo=(pos.aPagar||0);
  return {vAv:vAv, vAp:vAp, tot:tot, cmv:f.cmv||0, comissao:comissao, premio:premio,
          frete:frete, impostos:impTot, variavel:variavel,
          mc:mc, fixo:fixo, despFin:despFin, recFin:recFin, resultado:resultado,
          resCap: capital>0?resultado/capital*100:null,
          estoque:pos.estoque||0, compras:f.compras||0, aPagar:passivo, aReceber:pos.aReceber||0,
          caixa:caixa, imob:imob, func:v(ym,'funcionarios'),
          diasUteis:D.diasUteis[ym]||0,
          vendaDia:(D.diasUteis[ym]||0)>0 ? tot/D.diasUteis[ym] : 0,
          inad:(pos.inadimplencia==null?null:pos.inadimplencia),
          itensEstoque:pos.itensEstoque||0, itensGirados:f.itensGirados||0,
          capital:capital, ativos:ativos, passivo:passivo, dif:ativos-passivo,
          temPos:pos.temPos, atrasado:pos.atrasado};
}

/* Todas as despesas do mes, centro a centro, com a natureza e a linha do relatorio
   para onde cada uma vai — e o que permite conferir a classificacao. */
function renderDespesas(){
  const sel=document.getElementById('desp-mes');
  const tm={};
  Object.keys(D.contas).forEach(function(u){ Object.keys(D.contas[u]).forEach(function(m){ tm[m]=1; }); });
  const meses=Object.keys(tm).sort().reverse();
  if(!sel.options.length || sel.dataset.n!=String(meses.length)){
    sel.innerHTML=meses.map(function(m){return '<option value="'+m+'">'+rot(m)+'</option>'}).join('');
    sel.dataset.n=meses.length;
  }
  const ym=sel.value||meses[0];
  const lst=detalheMes(ym);
  const tot=lst.reduce(function(a,x){return a+x.v},0);
  const LBL={comissao:'Comissão',premio:'Prêmio',frete:'Frete vendas',impostos:'Impostos',
             despFin:'Despesa finan.',operacional:'Custo fixo / variável'};
  document.getElementById('desp-body').innerHTML=lst.map(function(x){
    return '<tr><td style="text-align:left">'+x.nome+'</td>'+
      '<td><span class="tag'+(x.n==='fixa'?'f':'v')+'">'+(x.n==='fixa'?'FIXA':'VARIÁVEL')+'</span></td>'+
      '<td style="color:#64748b">'+(LBL[x.l]||x.l)+'</td>'+
      '<td>'+fmt(x.v)+'</td><td>'+(tot>0?(x.v/tot*100).toFixed(1).replace('.',','):'0')+'%</td></tr>';
  }).join('')+
   '<tr class="tot"><td style="text-align:left">TOTAL — '+rotUnidades()+'</td><td></td><td></td><td>'+fmt(tot)+'</td><td>100%</td></tr>'+
   (function(){
     const fx=lst.filter(function(x){return x.n==='fixa'}).reduce(function(a,x){return a+x.v},0);
     const vr=tot-fx;
     return '<tr class="tot"><td style="text-align:left">Fixas</td><td></td><td></td><td>'+fmt(fx)+
            '</td><td>'+(tot>0?(fx/tot*100).toFixed(1).replace('.',','):'0')+'%</td></tr>'+
            '<tr class="tot"><td style="text-align:left">Variáveis</td><td></td><td></td><td>'+fmt(vr)+
            '</td><td>'+(tot>0?(vr/tot*100).toFixed(1).replace('.',','):'0')+'%</td></tr>';
   })();
}

    dados.map(d=>'<th>'+rot(d.ym)+(d.corrente?'<span class="tagp">parcial</span>':'')+'</th>').join('')+'</tr>';

    L('ESTOQUE',function(c){return c.estoque})+

    L('PASSIVO',function(c){return c.passivo},{cls:'tot'})+
    L('DIFERENÇA',function(c){return c.dif},{cls:'res'});

  // seletor de unidade (so aparece com mais de uma)
  if(D.unidades.length>1){
    const sel=unidades();
    document.getElementById('uni-box').style.display='flex';
    document.getElementById('uni-btns').innerHTML=D.unidades.map(function(u){
      return '<button class="btn" data-u="'+u[0]+'" onclick="toggleUni(this.dataset.u)"'+
        (sel.indexOf(u[0])>=0?' style="background:#1e293b;color:#fff;border-color:#1e293b"':'')+
        '>'+u[1]+'</button>';
    }).join('');
  }

  if(visao==='desp') renderDespesas();

  document.getElementById('ger').textContent='Gerado em '+D.geradoEm+' · posição de hoje '+
    D.hoje.split('-').reverse().join('/')+' · fechamento automático todo dia 1º'+
    (D.unidades.length>1?' · '+rotUnidades():'');
  document.getElementById('nota').innerHTML=
    '<b>Fluxo</b> (vendas, CMV, compras, itens girados) vem do banco e não muda depois que o mês fecha. '+
    '<b>Posição</b> (estoque, contas, caixa, itens em estoque) é uma foto: o mês fechado usa o valor gravado no <b>dia 1º</b>, '+
    'antes de qualquer movimentação; o mês corrente mostra a posição de hoje e por isso aparece esmaecido. '+
    '<b>À vista</b> = PIX, dinheiro, débito e crédito à vista; <b>a prazo</b> = cartão parcelado, faturamento e crediário. '+
    '<b>Comissão, prêmio, frete, impostos e juros vêm do sistema</b> (centros de custo e juros pagos/recebidos), pelo que foi PAGO no mês. '+
    '<b>Margem de contribuição</b> = vendas − CMV − comissão − prêmio − frete − impostos. '+
    '<b>Resultado</b> = MC − custo fixo − despesa variável − despesa financeira + receita financeira. '+
    'A aba <b>Despesas por centro</b> mostra centro a centro como cada despesa foi classificada. '+
    '<b>Ativos</b> = estoque + a receber + caixa + imobilizado; <b>Passivo</b> = contas a pagar. '+
    'Os campos amarelos ficam salvos <b>neste navegador</b>, <b>por unidade</b> — com mais de uma unidade marcada eles viram soma e não podem ser editados. '+
    'Use "Exportar lançamentos" para guardar uma cópia.'+
    (D.unidades.length>1?' Recorte atual: <b>'+rotUnidades()+'</b>.':'');
}

function repetirMesAnterior(){
  const tm={};
  Object.keys(D.fluxo).forEach(function(u){ Object.keys(D.fluxo[u]).forEach(function(m){ tm[m]=1; }); });
  const meses=Object.keys(tm).sort();
  const hoje=D.hoje.slice(0,7);
  const ant=meses[meses.indexOf(hoje)-1];
  if(!ant){ alert('Não há mês anterior.'); return; }
  const u=umaUnidade();
  if(!u){ alert('Selecione UMA unidade para copiar os lançamentos.'); return; }
  const m=man(); const mu=(m[u]=m[u]||{}); const base=mu[ant]||{};
  const estaveis=['imobilizado','funcionarios','capital'];
  mu[hoje]=Object.assign({},mu[hoje]||{});
  estaveis.forEach(function(k){ if(base[k]!=null) mu[hoje][k]=base[k]; });
  setMan(m); render();
  alert('Imobilizado, funcionários e capital social de '+rot(ant)+' copiados para '+rot(hoje)+'.');
}
function exportar(){
  const txt=JSON.stringify({empresa:EMP,aliquotas:aliq(),lancamentos:man()},null,1);
  navigator.clipboard.writeText(txt).then(
    function(){ alert('Lançamentos copiados. Guarde este texto — é a cópia de segurança do que você digitou.'); },
    function(){ prompt('Copie o texto:',txt); });
}
function salvarAliq(){
  const o={};
  ['csll','irpj','pis','cofins'].forEach(function(k){ o[k]=parseFloat(document.getElementById('al-'+k).value)||0; });
  localStorage.setItem(LS_ALIQ,JSON.stringify(o));
  document.getElementById('dlg').close(); render();
}
(function(){
  const a=aliq();
  document.getElementById('dlg-body').innerHTML=
    [['csll','CSLL'],['irpj','IRPJ'],['pis','PIS'],['cofins','COFINS']].map(function(p){
      return '<label>'+p[1]+'<span><input type="number" step="0.01" id="al-'+p[0]+'" value="'+a[p[0]]+'"> %</span></label>';
    }).join('');
})();
render();
</script></body></html>
