const LS='premiacao_mcmoto_params';
const PADRAO={ind:600, loja:400};
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const fmt=n=>'R$ '+Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=n=>'R$ '+Math.round(Number(n||0)).toLocaleString('pt-BR');
const rot=m=>{const p=m.split('-');return MES[+p[1]-1]+'/'+p[0].slice(2)};
const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* localStorage pode simplesmente NAO existir: navegador com dados de site bloqueados,
   modo restrito, ou a pagina aberta fora do painel. Sem guarda, a leitura estoura e a tela
   inteira fica em branco — com guarda, ela cai para as metas publicadas e segue. */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

function par(){
  let p={};
  try{ p=JSON.parse(lsGet(LS)||'{}'); }catch(e){ p={}; }
  return Object.assign({}, PADRAO, p);
}
function salvar(){
  const p={};
  [['ind','p-ind'],['loja','p-loja']].forEach(function(x){
    const v=parseFloat(document.getElementById(x[1]).value);
    if(!isNaN(v)&&v>=0) p[x[0]]=v;
  });
  lsSet(LS, JSON.stringify(p));
  render();
}
function padrao(){ lsDel(LS); render(); }

/* A META vem do PAINEL MENSAL, da mesma chave que a tela de la grava. Painel e mapa sao
   a mesma origem no GitHub Pages, entao a leitura e direta — nao ha meta em duplicidade. */
function metaDe(vendedor){
  const v=lsGet('mapa_meta_'+vendedor+'_vendas');
  const n=(v===null||v==='')?null:parseFloat(v);
  if(n && n>0) return n;                       // o que voce digitou vence
  const pub=(D.metas||{})[vendedor];           // senao, a meta publicada no painel
  return (pub && pub>0) ? pub : null;
}
function metaPublicada(){ return Object.keys(D.metas||{}).length; }

function render(){
  const p=par();
  document.getElementById('p-ind').value=p.ind;
  document.getElementById('p-loja').value=p.loja;

  const sel=document.getElementById('mes');
  if(!sel.options.length){
    sel.innerHTML=D.meses.slice().reverse().map(function(m){
      return '<option value="'+m+'">'+rot(m)+'</option>'}).join('');
  }
  const ym=sel.value||D.meses[D.meses.length-1];
  const corrente=(ym===D.mesCorrente);
  document.getElementById('ger').textContent='Gerado em '+D.geradoEm+' · banco mc_moto';

  // realizado do mes, por vendedor
  const real={};
  D.dados.forEach(function(r){ if(r[0]===ym) real[D.vendedores[r[1]]]={v:r[2], c:r[3], ped:r[4]}; });

  /* Participa quem TEM META cadastrada. Resolve sozinho o caso de MERCADO LIVRE, SHOPEE e
     VENDEDOR 1, que sao canais e nao pessoas: sem meta, ficam fora do programa. */
  const linhas=D.vendedores.map(function(v){
    const m=metaDe(v), r=real[v]||{v:0,c:0,ped:0};
    return {nome:v, meta:m, venda:r.v, custo:r.c, participa:(m!==null)};
  }).filter(function(x){ return x.participa || x.venda>0; })
    .sort(function(a,b){ return (b.participa-a.participa) || (b.venda-a.venda); });

  const time=linhas.filter(function(x){ return x.participa; });
  const semMeta=linhas.filter(function(x){ return !x.participa && x.venda>0; });

  // ritmo: dias com faturamento ja decorridos contra a media dos meses fechados
  const diasMes=D.dias[ym]||0;
  const fechados=D.meses.filter(function(m){ return m!==D.mesCorrente; });
  const diasTipico=fechados.length
    ? Math.round(fechados.reduce(function(s,m){ return s+(D.dias[m]||0); },0)/fechados.length) : diasMes;
  const diasTotal=corrente ? Math.max(diasMes, diasTipico) : diasMes;
  const proj=function(x){ return (corrente && diasMes>0) ? x.venda/diasMes*diasTotal : x.venda; };

  const metaLoja=time.reduce(function(s,x){ return s+x.meta; },0);
  const vendaLoja=time.reduce(function(s,x){ return s+x.venda; },0);
  const lojaOk=metaLoja>0 && vendaLoja>=metaLoja;
  const bateram=time.filter(function(x){ return x.venda>=x.meta; });
  const custo=bateram.length*p.ind + (lojaOk?time.length*p.loja:0);
  const teto=time.length*(p.ind+p.loja);

  // ---------- aviso quando nao ha meta cadastrada neste navegador ----------
  document.getElementById('aviso-metas').innerHTML = time.length
    ? (semMeta.length
        ? '<div class="aviso">⚠️ <b>'+semMeta.length+' vendedor(es) sem meta cadastrada</b> ficam fora do programa: '+
          semMeta.map(function(x){return esc(x.nome)}).join(', ')+
          '. Cadastre a meta no <b>Painel Mensal</b> para incluir, ou ignore se não for vendedor de balcão.</div>'
        : '')
    : '<div class="aviso">⚠️ <b>Nenhuma meta cadastrada.</b> As metas são as do <b>Painel Mensal</b>. '+
      'Cadastre lá as metas de vendas e volte aqui — ou publique-as no painel pelo botão '+
      '<b>⚙️ Exportar parâmetros</b>, para valerem para todos.</div>';

  // ---------- KPIs ----------
  const falta=metaLoja-vendaLoja;
  document.getElementById('kpis').innerHTML=
    '<div class="kpi"><label>Meta da loja</label><div class="v">'+fmt0(metaLoja)+'</div>'+
      '<div class="s">soma das metas de '+time.length+' vendedor'+(time.length===1?'':'es')+'</div></div>'+
    '<div class="kpi'+(lojaOk?' ok':'')+'"><label>Faturamento do mês</label><div class="v">'+fmt0(vendaLoja)+'</div>'+
      '<div class="s">'+(lojaOk?'meta batida':(metaLoja?'faltam '+fmt0(falta):'sem meta cadastrada'))+'</div></div>'+
    '<div class="kpi'+(bateram.length?' ok':'')+'"><label>Bateram a própria meta</label>'+
      '<div class="v">'+bateram.length+' / '+time.length+'</div>'+
      '<div class="s">'+fmt0(bateram.length*p.ind)+' em prêmio individual</div></div>'+
    '<div class="kpi"><label>Custo do programa</label><div class="v">'+fmt0(custo)+'</div>'+
      '<div class="s">de '+fmt0(teto)+' possíveis'+(corrente?' · mês em andamento':'')+'</div></div>'+
    '<div class="kpi"><label>Por vendedor</label><div class="v">'+fmt0(time.length?custo/time.length:0)+'</div>'+
      '<div class="s">média de quem participa</div></div>';

  // ---------- cartoes ----------
  document.getElementById('premios').innerHTML=
    '<div class="pr ind"><h3>👤 Produção individual</h3>'+
      '<div class="cond">Bateu a <b>sua meta de vendas</b> do mês, do Painel Mensal. Não depende dos outros.</div>'+
      '<div class="eq">'+fmt0(p.ind)+'</div>'+
      '<div class="status" style="background:'+(bateram.length?'#1a7f37':'#21262d')+';color:'+(bateram.length?'#fff':'#8b949e')+'">'+
        bateram.length+' de '+time.length+' garantiram</div></div>'+
    '<div class="pr loj"><h3>🏪 Produção da loja</h3>'+
      '<div class="cond">A loja bateu a <b>meta geral</b> ('+fmt0(metaLoja)+', soma das metas). Sai para todos ou para ninguém.</div>'+
      '<div class="eq">'+fmt0(p.loja)+'</div>'+
      '<div class="status" style="background:'+(lojaOk?'#1f6feb':'#21262d')+';color:'+(lojaOk?'#fff':'#8b949e')+'">'+
        (lojaOk?'BATIDA · '+fmt0(time.length*p.loja)+' para o time'
               :(metaLoja?'faltam '+fmt0(falta):'sem meta'))+'</div></div>';

  // ---------- tabela ----------
  document.getElementById('body').innerHTML=linhas.map(function(x){
    if(!x.participa){
      return '<tr class="fora"><td>'+esc(x.nome)+'</td><td colspan="4">sem meta cadastrada — fora do programa</td>'+
        '<td>—</td><td>—</td><td>—</td><td>—</td></tr>';
    }
    const pct=x.meta?x.venda/x.meta*100:0;
    const bateu=x.venda>=x.meta;
    const pj=proj(x);
    const cor=bateu?'#3fb950':(pct>=85?'#d29922':'#f85149');
    const ganhoI=bateu?p.ind:0, ganhoL=lojaOk?p.loja:0;
    return '<tr><td>'+esc(x.nome)+'</td>'+
      '<td>'+fmt0(x.meta)+'</td>'+
      '<td class="'+(bateu?'ok':'')+'">'+fmt(x.venda)+'</td>'+
      '<td><b style="color:'+cor+'">'+pct.toFixed(1).replace('.',',')+'%</b>'+
        '<div class="barra-prog"><i style="width:'+Math.min(100,pct).toFixed(0)+'%;background:'+cor+'"></i></div></td>'+
      '<td>'+(bateu?'<span class="ok">✔</span>':fmt(x.meta-x.venda))+'</td>'+
      '<td'+(corrente?'':' style="color:#6e7681"')+'>'+(corrente
          ? fmt0(pj)+' <span style="font-size:10px;color:'+(pj>=x.meta?'#3fb950':'#f85149')+'">'+
            (pj>=x.meta?'bate':'não bate')+'</span>'
          : '—')+'</td>'+
      '<td>'+(bateu?'<span class="ok">'+fmt0(p.ind)+'</span>':'—')+'</td>'+
      '<td>'+(lojaOk?'<span class="ok">'+fmt0(p.loja)+'</span>':'—')+'</td>'+
      '<td><b>'+(ganhoI+ganhoL?fmt0(ganhoI+ganhoL):'—')+'</b></td></tr>';
  }).join('') || '<tr><td colspan="9" style="text-align:center;color:#6e7681;padding:20px">Sem vendas neste mês.</td></tr>';

  if(time.length){
    const pctL=metaLoja?vendaLoja/metaLoja*100:0;
    document.getElementById('body').insertAdjacentHTML('beforeend',
      '<tr class="tot"><td>LOJA</td><td>'+fmt0(metaLoja)+'</td><td>'+fmt(vendaLoja)+'</td>'+
      '<td style="color:'+(lojaOk?'#3fb950':'#f85149')+'">'+pctL.toFixed(1).replace('.',',')+'%</td>'+
      '<td>'+(lojaOk?'<span class="ok">✔</span>':fmt(falta))+'</td>'+
      '<td>'+(corrente?fmt0(time.reduce(function(s,x){return s+proj(x)},0)):'—')+'</td>'+
      '<td>'+fmt0(bateram.length*p.ind)+'</td>'+
      '<td>'+fmt0(lojaOk?time.length*p.loja:0)+'</td>'+
      '<td><b>'+fmt0(custo)+'</b></td></tr>');
  }

  // ---------- regras ----------
  document.getElementById('regras').innerHTML=
    '<div class="regra"><b>'+fmt0(p.ind)+'</b> — bateu a sua meta de vendas do mês. Individual: não depende do resto do time.</div>'+
    '<div class="regra"><b>'+fmt0(p.loja)+'</b> — a loja bateu a meta geral, que é a <b>soma das metas individuais</b> ('+fmt0(metaLoja)+'). Sai para todos ou para ninguém.</div>'+
    '<div class="regra">Teto de <b>'+fmt0(p.ind+p.loja)+'</b> por vendedor no mês, quando as duas condições acontecem.</div>'+
    '<div class="regra">Não há piso de margem: o prêmio é por faturamento.</div>'+
    '<div class="regra">A meta é a do <b>Painel Mensal</b> — quem não tem meta cadastrada não participa nem entra no rateio.</div>';

  document.getElementById('nota').innerHTML=
    'Venda <b>líquida de devolução</b>, não canceladas — a mesma base do Painel Mensal e da aba Vendas Históricas. '+
    '<b>No ritmo fecha em</b> projeta o mês pelos dias que já tiveram faturamento contra os '+diasTotal+' dias típicos do mês; '+
    'em mês fechado a coluna não se aplica. '+
    'A <b>meta</b> é a do Painel Mensal: vale a que estiver neste navegador e, quando não houver, a <b>publicada no painel</b> '+
    '(hoje '+metaPublicada()+' vendedores publicados, atualizados em '+(D.metasEm||'—')+'). Mudar a meta no Painel Mensal muda esta tela na hora. '+
    'Os valores dos prêmios ficam salvos neste navegador; publique-os junto com as metas para valerem para todos.';
}
render();
</script>
</body>
</html>
