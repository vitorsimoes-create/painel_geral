<style>
 *{box-sizing:border-box;margin:0;padding:0}
 body{font-family:Arial,Helvetica,sans-serif;background:#f2f4f7;color:#222;padding:18px;font-size:13px}
 h1{background:#0f766e;color:#fff;padding:14px 18px;border-radius:6px;font-size:18px;margin-bottom:6px}
 .sub{font-size:12px;color:#666;margin-bottom:14px}
 .barra{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#fff;border-radius:8px;
        padding:10px 14px;box-shadow:0 1px 3px rgba(0,0,0,.12);margin-bottom:14px;font-size:12px}
 .barra b{color:#0f766e}
 select,input{border:1px solid #cbd5e1;border-radius:5px;padding:5px 8px;font-size:12px;font-family:inherit}
 .btn{border:1px solid #cbd5e1;border-radius:20px;background:#fff;padding:5px 13px;font-size:12px;
      font-weight:bold;color:#64748b;cursor:pointer;font-family:inherit}
 .btn.ativo{background:#0f766e;border-color:#0f766e;color:#fff}
 .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
 .card{background:#fff;border-radius:8px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
 .card label{display:block;font-size:11px;color:#666;margin-bottom:4px}
 .card .v{font-weight:bold;font-size:20px;color:#0f766e}
 .card .s{font-size:11px;color:#94a3b8;margin-top:2px}
 .cx{background:#fff;border-radius:8px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.12);margin-bottom:14px}
 .cx h2{font-size:12px;color:#0f766e;text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
 table{width:100%;border-collapse:collapse;font-size:12px;background:#fff}
 th,td{padding:6px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid #eee}
 th{background:#0f766e;color:#fff;font-size:10px;text-transform:uppercase;cursor:pointer;
    position:sticky;top:0;z-index:2}
 td:first-child,th:first-child{text-align:left}
 .wrap{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.12);overflow:auto;max-height:60vh}
 .tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:bold}
 .ok{background:#dcfce7;color:#166534}.nao{background:#fee2e2;color:#991b1b}
 .nota{font-size:11px;color:#888;margin-top:10px;line-height:1.7}
 .drop{position:relative;display:inline-block}
 .drop .painel{position:absolute;z-index:20;top:110%;left:0;background:#fff;border:1px solid #cbd5e1;
   border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.16);padding:8px;min-width:230px;max-height:280px;
   overflow:auto;display:none}
 .drop.aberto .painel{display:block}
 .drop .painel label{display:flex;align-items:center;gap:7px;padding:4px 5px;border-radius:5px;
   font-size:12px;cursor:pointer;white-space:nowrap}
 .drop .painel label:hover{background:#f1f5f9}
 .drop .painel .qtd{margin-left:auto;color:#94a3b8;font-size:11px}
 .barras{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:8px}
 .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;min-width:26px}
 .col .b{width:100%;background:#cbd5e1;border-radius:3px 3px 0 0;position:relative}
 .col .b i{position:absolute;left:0;right:0;bottom:0;background:#0f766e;border-radius:3px 3px 0 0;display:block}
 .col .r{font-size:10px;color:#64748b;white-space:nowrap}
 .col .n{font-size:10px;font-weight:bold;color:#334155}

<h1>🗂️ Cadastro de Cliente — RHS/SEVEN</h1>
<div class="sub" id="ger"></div>

<div class="barra">

    <option value="24">Últimos 24 meses</option>

  <span style="width:1px;height:20px;background:#e2e8f0"></span>

  <span style="width:1px;height:20px;background:#e2e8f0"></span>

  <span class="drop" id="drop-grupo">

  <span style="width:1px;height:20px;background:#e2e8f0"></span>
  <b>Tipo:</b>
  <button class="btn ativo" data-t="todos" onclick="setTipo('todos')">Todos</button>
  <button class="btn" data-t="J" onclick="setTipo('J')">Jurídica</button>
  <button class="btn" data-t="F" onclick="setTipo('F')">Física</button>
  <span style="width:1px;height:20px;background:#e2e8f0"></span>
  <b>Mostrar:</b>
  <button class="btn ativo" data-f="todos" onclick="setFiltro('todos')">Todos</button>
  <button class="btn" data-f="comprou" onclick="setFiltro('comprou')">Compraram</button>
  <button class="btn" data-f="nunca" onclick="setFiltro('nunca')">Nunca compraram</button>
  <span style="flex:1"></span>
  <input type="text" id="busca" placeholder="buscar cliente..." oninput="render()" style="width:210px">
</div>

<div class="cards" id="kpis"></div>
<div class="cx"><h2>Cadastros por mês — quantos viraram cliente <span id="graf-un" style="text-transform:none;color:#94a3b8;font-weight:normal"></span></h2><div class="barras" id="graf"></div></div>

               tudo:'0000-01-01'}[document.getElementById('periodo').value];
  const busca=(document.getElementById('busca').value||'').trim().toUpperCase();
  return D.clientes.filter(function(r){
    if(r[2]<corte) return false;
    if(grpSel.size && !grpSel.has(r[4])) return false;
    if(tipo!=='todos' && r[5]!==tipo) return false;
    if(busca && (r[1]||'').toUpperCase().indexOf(busca)<0) return false;
    return true;
  }).map(function(r){
    // r[3] = {unidade: [1a compra, ultima, nº compras, total]} — soma so o que esta em foco
    let prim=null, ult=null, q=0, v=0; const uns=[];
    Object.keys(r[3]||{}).forEach(function(u){
      if(!unOk(u)) return;
      const d=r[3][u];
      if(!prim || d[0]<prim) prim=d[0];
      if(!ult  || d[1]>ult ) ult =d[1];
      q+=d[2]; v+=d[3]; uns.push(u);
    });
    return {cod:r[0], nome:r[1], cad:r[2], prim:prim, ult:ult, q:q, v:v,
            un:uns.sort().join('/'), grupo:r[4], tipo:r[5],
            dias: prim ? difDias(r[2], prim) : null, st: prim ? 'comprou' : 'nunca'};
  }).filter(function(x){
    // comprou/nunca so pode ser decidido DEPOIS do recorte por unidade
    if(filtro==='comprou') return !!x.prim;
    if(filtro==='nunca')   return !x.prim;
    return true;
  });
}

function ordenar(k){
  ordem = (ordem.k===k) ? {k:k, dir:-ordem.dir} : {k:k, dir:(k==='nome'?1:-1)};
  render();
}

function render(){
  const l=linhas();
  const comprou=l.filter(x=>x.prim);
  const nunca=l.length-comprou.length;
  const conv=l.length?comprou.length/l.length*100:0;
  const comDias=comprou.filter(x=>x.dias!=null);
  const medio=comDias.length?comDias.reduce((s,x)=>s+x.dias,0)/comDias.length:null;
  const mesmoDia=comDias.filter(x=>x.dias===0).length;
  const total=comprou.reduce((s,x)=>s+x.v,0);

  document.getElementById('ger').textContent='Gerado em '+D.geradoEm+' · '+D.clientes.length+
    ' cadastros no histórico · conversão contada em '+rotUnidades();
  document.getElementById('kpis').innerHTML=
    '<div class="card"><label>Cadastros no período</label><div class="v">'+l.length+'</div></div>'+
    '<div class="card"><label>Viraram cliente</label><div class="v">'+comprou.length+'</div>'+
      '<div class="s">'+conv.toFixed(1).replace('.',',')+'% de conversão</div></div>'+
    '<div class="card"><label>Nunca compraram</label><div class="v" style="color:#b91c1c">'+nunca+'</div>'+
      '<div class="s">'+(l.length?(nunca/l.length*100).toFixed(1).replace('.',','):0)+'% do período</div></div>'+
    '<div class="card"><label>Dias até a 1ª compra</label><div class="v">'+
      (medio==null?'—':Math.round(medio))+'</div><div class="s">'+mesmoDia+' compraram no mesmo dia</div></div>'+
    '<div class="card"><label>Comprado por eles</label><div class="v">'+fmt0(total)+'</div>'+
      '<div class="s">'+(comprou.length?fmt0(total/comprou.length)+' por cliente':'—')+'</div></div>';

  // grafico: cadastros por mes, com a parte que converteu preenchida
  const pm={};
  l.forEach(function(x){ const m=x.cad.slice(0,7);
    const o=pm[m]||(pm[m]={t:0,c:0}); o.t++; if(x.prim) o.c++; });
  document.getElementById('graf-un').textContent=' · '+rotUnidades()+
    (grpSel.size?' · '+rotGrupos():'')+(tipo!=='todos'?' · '+TIPO_ROT[tipo]:'');
  document.getElementById('btn-grupo').textContent=
    (grpSel.size ? (grpSel.size===1 ? [...grpSel][0] : grpSel.size+' grupos') : 'Todos')+' ▾';
  const meses=Object.keys(pm).sort().slice(-18);
  const max=Math.max(1, ...meses.map(m=>pm[m].t));
  document.getElementById('graf').innerHTML=meses.map(function(m){
    const o=pm[m], h=Math.round(o.t/max*118);
    return '<div class="col" title="'+rot(m)+': '+o.t+' cadastros, '+o.c+' compraram">'+
      '<div class="n">'+o.t+'</div>'+
      '<div class="b" style="height:'+h+'px"><i style="height:'+Math.round(o.c/o.t*h)+'px"></i></div>'+
      '<div class="r">'+rot(m)+'</div></div>';
  }).join('') || '<div style="color:#94a3b8;font-size:12px">Sem cadastros no período.</div>';

  // tabela
  const k=ordem.k, dir=ordem.dir;
  l.sort(function(a,b){
    let va=a[k], vb=b[k];
    if(va==null && vb==null) return 0;
    if(va==null) return 1;          // sem valor sempre por ultimo
    if(vb==null) return -1;
    if(typeof va==='string') return va.localeCompare(vb)*dir;
    return (va-vb)*dir;
  });
  document.getElementById('body').innerHTML=l.map(function(x){
    return '<tr>'+
      '<td>'+esc(x.nome)+'</td>'+
      '<td>'+dt(x.cad)+'</td>'+
      '<td>'+dt(x.prim)+'</td>'+
      '<td>'+(x.dias==null?'—':x.dias+' d')+'</td>'+
      '<td>'+(x.q||'—')+'</td>'+
      '<td>'+(x.v?fmt(x.v):'—')+'</td>'+
      '<td>'+dt(x.ult)+'</td>'+
      '<td>'+(x.un||'—')+'</td>'+
      '<td style="font-size:11px;color:#475569">'+esc(x.grupo)+'</td>'+
      '<td style="font-size:11px">'+(x.tipo==='J'?'PJ':(x.tipo==='F'?'PF':'—'))+'</td>'+
      '<td><span class="tag '+(x.prim?'ok':'nao')+'">'+(x.prim?'comprou':'nunca comprou')+'</span></td></tr>';
  }).join('') || '<tr><td colspan="11" style="text-align:center;color:#94a3b8;padding:20px">Nenhum cadastro com esse filtro.</td></tr>';

  document.getElementById('nota').innerHTML=
    'A <b>data do cadastro</b> vem de <i>TCLI_DATA_CADASTRAMENTO</i>, do cadastro do cliente. '+
    'A <b>compra</b> é qualquer pedido não cancelado. Como o cadastro é do grupo e não tem unidade, o filtro de unidade age sobre a <b>compra</b>: '+
    'com uma unidade marcada, quem comprou só em outra loja aparece como <b>nunca comprou</b> — é assim que se lê "quantos dos meus cadastros compraram aqui". '+
    'O <b>grupo</b> é o do cadastro no ERP (GRUPO PADRÃO, LEADS VAREJO, INSTAGRAM/FACE, GOOGLE...), ou seja de onde o cliente veio; '+
    '<b>PJ/PF</b> vem de <i>TCLI_TIPO_PESSOA</i>. '+
    'Recorte atual: <b>'+rotUnidades()+' · '+rotGrupos()+' · '+(tipo==='todos'?'PJ e PF':TIPO_ROT[tipo])+'</b>. '+
    '<b>Dias até comprar</b> = da data do cadastro até a primeira compra; 0 significa que foi cadastrado e comprou no mesmo dia. '+
    'No gráfico, a barra inteira é o total de cadastros do mês e a parte escura é quanto deles já comprou. '+
    'O consumidor genérico do balcão fica de fora. Clique no cabeçalho para ordenar.';
}
document.querySelectorAll('#tbl thead th').forEach(function(th){
  th.onclick=function(){ ordenar(th.dataset.k); };
});
montarGrupos();
render();
</script>
</body>
</html>
