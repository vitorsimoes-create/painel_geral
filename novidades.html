<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novidades do Painel</title>
<style>
  * { box-sizing:border-box; }
  body { font-family:Arial,Helvetica,sans-serif; background:#f2f4f7; margin:0; padding:20px 16px; color:#222; }
  .wrap { max-width:820px; margin:0 auto; }
  h1 { background:#1f4e78; color:#fff; padding:14px 18px; border-radius:6px; font-size:18px; margin:0 0 6px; }
  .sub { font-size:12px; color:#666; margin-bottom:18px; }
  .edicao { background:#fff; border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.12); padding:16px 18px; margin-bottom:18px; }
  .edicao h2 { font-size:15px; margin:0 0 4px; color:#1f4e78; }
  .edicao .periodo { font-size:12px; color:#666; margin-bottom:12px; }
  .resumo { font-size:13px; line-height:1.6; margin:0 0 12px; }
  .item { border-left:3px solid #cbd5e1; padding:6px 0 6px 12px; margin:10px 0; }
  .item.novo { border-color:#15803d; }
  .item.melhoria { border-color:#1f4e78; }
  .item.correcao { border-color:#b45309; }
  .item.aviso { border-color:#c00000; }
  .item .tit { font-size:13px; font-weight:bold; }
  .item .onde { font-size:11px; color:#64748b; margin:2px 0 4px; }
  .item p { font-size:13px; line-height:1.55; margin:0; color:#333; }
  .tag { display:inline-block; font-size:10px; font-weight:bold; padding:2px 8px; border-radius:10px; margin-right:6px; vertical-align:1px; }
  .tag.novo { background:#dcfce7; color:#166534; }
  .tag.melhoria { background:#dbeafe; color:#1e3a8a; }
  .tag.correcao { background:#ffedd5; color:#9a3412; }
  .tag.aviso { background:#fee2e2; color:#991b1b; }
  .vazio { font-size:13px; color:#666; }
  @media (prefers-color-scheme: dark) {
    body { background:#0f172a; color:#e2e8f0; }
    .edicao { background:#1e293b; box-shadow:none; }
    .edicao h2 { color:#93c5fd; }
    .item p { color:#cbd5e1; }
    .sub, .edicao .periodo, .item .onde, .vazio { color:#94a3b8; }
  }
</style>
</head><body><div class="wrap">
<h1>Novidades do Painel — MC MOTO e SEVEN</h1>
<div class="sub">Resumo semanal do que mudou no painel. A edição mais recente fica no topo.</div>
<div id="edicoes"></div>
</div>
<script>
// Uma edição por semana, a mais recente PRIMEIRO. A rotina semanal acrescenta no topo.
// tipo: novo | melhoria | correcao | aviso
const EDICOES = [
  {
    semana: "02/10 a 08/10/2026",
    publicado: "09/10/2026",
    resumo: "Semana de Montar Pedido: a MC MOTO ganhou filtro por marca e, na SEVEN, o custo dos itens passou a ser o que a loja realmente paga na nota. Atenção: as Contas a Receber da MC MOTO seguem sem dados desde 30/09, ainda sem solução.",
    itens: [
      { tipo: "novo", titulo: "Montar Pedido: filtro por marca",
        onde: "MC MOTO › Compras › Montar Pedido",
        texto: "Agora dá para filtrar os itens por marca, escolhendo várias de uma vez. O menu tem busca, uma caixinha por marca com a quantidade de itens ao lado e os botões Limpar e Aplicar, igual ao filtro de fornecedor. A marca vem do cadastro do produto; os itens sem marca cadastrada aparecem em \"(sem marca)\", que também pode ser filtrado para ajudar a arrumar o cadastro. O botão \"Limpar filtros\" da aba também limpa a marca." },
      { tipo: "melhoria", titulo: "SEVEN: custo do item igual ao custo real da nota de entrada",
        onde: "SEVEN › Compras › Montar Pedido e Análise de Fornecedor",
        texto: "O custo mostrado passou a ser o custo real da última compra, já com os impostos que a loja paga (como a substituição tributária na unidade 5) e sem o crédito de imposto da unidade 3. Exemplo: um item que aparecia a R$ 54,29 agora aparece a R$ 71,77, que é o que custou de fato. Com isso, o estoque a custo da unidade 5 subiu cerca de 15% e o da unidade 3 caiu cerca de 1%, e mudou um pouco a lista de itens marcados para inativar por margem baixa. A unidade Contagem continua com o custo vindo do Bling." },
      { tipo: "melhoria", titulo: "Montar Pedido: aviso de inativo não corta mais a descrição",
        onde: "Compras › Montar Pedido",
        texto: "O aviso \"INATIVO NO ERP\" ficava ao lado do nome e cortava o fim da descrição. Agora é um marcador curto na coluna do código; passando o mouse sobre ele (ou sobre a descrição) aparece o texto completo. Para ver só esses itens, use o filtro \"Inativos no ERP\" em Mostrar apenas." },
      { tipo: "correcao", titulo: "Busca não embaralha mais a descrição",
        onde: "Busca por descrição (MC MOTO e SEVEN)",
        texto: "Ao buscar com mais de uma palavra (por exemplo \"FILTRO A\"), o destaque amarelo das palavras encontradas quebrava o texto e a descrição aparecia com pedaços de código no meio. Isso foi corrigido nas duas empresas: as palavras buscadas aparecem destacadas e o resto da descrição fica intacto." },
      { tipo: "aviso", titulo: "Contas a Receber da MC MOTO sem dados desde 30/09",
        onde: "MC MOTO › Contas a Receber, Posição de Caixa e Clientes",
        texto: "Desde 30/09 o sistema não está enviando as contas a receber da MC MOTO para o painel. Por isso a aba Contas a Receber aparece vazia, a Posição de Caixa da MC MOTO está sem os recebimentos previstos e a inadimplência dos clientes aparece zerada. Ainda não está resolvido: até lá, consulte os valores a receber direto no sistema." },
      { tipo: "aviso", titulo: "Painel sem atualização no fim de semana (03 e 04/10)",
        onde: "Painel inteiro",
        texto: "A atualização automática não rodou no sábado, 03/10, nem no domingo, 04/10. Os números voltaram a ser atualizados em 05/10 (no fim da manhã) e seguiram normais no resto da semana." }
    ]
  },
  {
    semana: "25/09 a 01/10/2026",
    publicado: "02/10/2026",
    resumo: "Semana de Dashboard: ele ganhou alertas do dia, atalhos para as abas e passou a mostrar os mesmos números para todos, iguais aos do Painel Mensal e do Relatório Gerencial. O painel também abre muito mais rápido, e a SEVEN Contagem, que saiu do ERP em 28/09, passou a ser lida do Bling sem perder o histórico.",
    itens: [
      { tipo: "novo", titulo: "Dashboard: alertas \"Atenção hoje\" e atalhos para as abas",
        onde: "Dashboard (MC MOTO e SEVEN)",
        texto: "Acima dos indicadores aparecem até 5 alertas do dia, como venda projetada abaixo do ponto de equilíbrio, caixa negativo nos próximos 7 dias, ritmo da meta, vendedor ou unidade abaixo de 80% da meta, contas vencidas nos últimos 30 dias e margem abaixo da média de 12 meses. Cada alerta e cada gráfico tem um link \"abrir\" que leva direto para a aba onde agir. Na MC MOTO, clicar em um vendedor abre o Painel Mensal no mês a mês dele. Os indicadores detalhados agora ficam recolhidos (fechados no celular) e podem ser abertos quando precisar." },
      { tipo: "melhoria", titulo: "Painel abre em menos de meio segundo",
        onde: "Painel inteiro",
        texto: "O painel abria em cerca de 5 segundos e agora abre em menos de meio. Os dados de Compras e as abas internas só carregam quando você entra nelas, então a primeira abertura de uma aba de Compras pode levar um instante. No celular não há mais rolagem para os lados: as abas deslizam e os indicadores ficam em duas colunas." },
      { tipo: "melhoria", titulo: "Dashboard: contas, caixa e comparações mais claras",
        onde: "Dashboard (MC MOTO e SEVEN)",
        texto: "Contas a pagar em atraso agora aparecem separadas por idade (até 30, 31 a 90 e mais de 90 dias), e os vencimentos mostram os próximos 7 e 30 dias. O bloco de caixa usa a mesma regra da aba Posição de Caixa e bate com ela. O mês em aberto é comparado pela projeção e pelos mesmos dias do mês anterior, as vendas mostram a última semana completa ao lado da atual e o estoque parado é dividido entre \"sem venda em 12 meses\" e \"acima de 3 vezes o pico\". A meta da SEVEN passou a ser a soma das metas das unidades (R$ 330 mil)." },
      { tipo: "melhoria", titulo: "SEVEN Contagem passa a vir do Bling",
        onde: "SEVEN › Unidade Contagem (Relatório Gerencial, Dashboard, Mapa de Vendas, Premiação, Montar Pedido, contas a pagar e a receber)",
        texto: "A loja de Contagem deixou de usar o ERP em 28/09 e passou a faturar pelo Bling. O painel junta as duas fontes: até 28/09 os números vêm do ERP e, a partir de 29/09, do Bling, sem contar nenhum dia duas vezes. O estoque e o custo de Contagem vêm do Bling, e no Montar Pedido entraram cerca de 900 produtos com R$ 173 mil em estoque que antes não apareciam. O pico de vendas de setembro soma as duas fontes, para que a sugestão de compra não fique pela metade." },
      { tipo: "correcao", titulo: "Dashboard: os mesmos números para toda a equipe",
        onde: "Dashboard (MC MOTO e SEVEN)",
        texto: "Parte da equipe via lucro em setembro enquanto a gerência via prejuízo, porque o Dashboard usava parâmetros diferentes em cada computador. Agora todos veem os valores publicados pela gerência. A meta da MC MOTO é a mesma do total do Painel Mensal (antes somava também as metas da SEVEN) e o custo fixo é a linha \"Custo fixo\" do Relatório Gerencial, batendo centavo a centavo nas duas empresas." },
      { tipo: "correcao", titulo: "Dashboard SEVEN: estoque sem a Ultra Motos",
        onde: "Dashboard (SEVEN)",
        texto: "O estoque, o giro, a cobertura e o estoque parado da SEVEN agora consideram só as unidades em operação, porque o estoque da Ultra Motos no ERP estava errado e a loja está inativa. O histórico de vendas da Ultra Motos continua contando." },
      { tipo: "aviso", titulo: "Vendas de Contagem de 29/09 ficaram fora até 30/09 à tarde",
        onde: "SEVEN › telas com vendas da unidade Contagem",
        texto: "Na atualização da manhã de 30/09, as vendas de Contagem do dia 29/09 ainda não apareciam, porque a loja já tinha saído do ERP e a leitura do Bling ainda não estava pronta. Isso foi resolvido em 30/09 à tarde e, desde então, os números de Contagem estão em dia." },
      { tipo: "aviso", titulo: "Painel sem atualização em 27/09 (domingo)",
        onde: "Painel inteiro",
        texto: "A atualização automática não rodou no domingo, 27/09. Os números voltaram a ser atualizados em 28/09 normalmente." }
    ]
  },
  {
    semana: "18/09 a 24/09/2026",
    publicado: "24/09/2026",
    resumo: "Semana focada na Análise de Fornecedor, que ganhou filtros e uma visão por grupo de mercadoria, e em Vendas Diárias, que agora abre por vendedor. Houve também uma interrupção nos dados da MC MOTO entre 22 e 24/09, causada pela atualização do sistema (ERP), já resolvida.",
    itens: [
      { tipo: "novo", titulo: "Análise de Fornecedor: nova visão \"Por grupo e subgrupo\"",
        onde: "Compras › Análise de Fornecedor (MC MOTO e SEVEN)",
        texto: "O excesso de estoque agora pode ser visto somado por grupo de mercadoria. Clique em um grupo para abrir os subgrupos. Na MC MOTO, os itens cadastrados como DIVERSOS passaram a ser classificados pela descrição do produto, e esses itens aparecem marcados como classificação deduzida. O excesso que antes aparecia quase todo como \"DIVERSOS\" agora mostra onde está de verdade: MOTOR 27,5%, BOUTIQUE 21,8% e PARTES DE RODA 10,9%. O cadastro do ERP não foi alterado." },
      { tipo: "novo", titulo: "Análise de Fornecedor: filtros de grupo e subgrupo",
        onde: "Compras › Análise de Fornecedor (MC MOTO e SEVEN)",
        texto: "Escolha um grupo e, se quiser, um subgrupo de mercadoria. O filtro vale para a aba toda: a tabela, o estoque por fornecedor e os totais do topo passam a mostrar só aquele recorte." },
      { tipo: "novo", titulo: "Vendas Diárias: filtro por vendedor",
        onde: "Vendas › Vendas Diárias (MC MOTO e SEVEN)",
        texto: "Agora dá para ver o dia de um ou mais vendedores, marcando os botões com os nomes. Sem ninguém marcado, os números são os mesmos de antes. Na SEVEN, a seleção de vendedores é a mesma da aba Gráficos: se você escolher alguém em uma aba, a escolha vale também na outra." },
      { tipo: "aviso", titulo: "Dados da MC MOTO desatualizados de 22/09 à tarde até 24/09",
        onde: "Todas as abas da MC MOTO que usam vendas e produtos",
        texto: "A atualização de versão do ERP em 22/09 impediu a cópia de vendas e produtos para o banco do painel. Em 23/09 essas abas da MC MOTO ficaram com os números de 22/09. Contas a Receber, Recebimentos e tudo da SEVEN foram atualizados normalmente. A cópia voltou a funcionar em 24/09 à tarde e o painel já está em dia. O painel também passou a interromper a atualização quando vier sem dados, para que as abas não fiquem zeradas." },
      { tipo: "aviso", titulo: "Painel sem atualização de 19 a 21/09",
        onde: "Painel inteiro",
        texto: "A atualização automática não rodou nesses três dias. Os números voltaram a ser atualizados em 22/09." }
    ]
  }
];

const ROTULO = { novo:"NOVO", melhoria:"MELHORIA", correcao:"CORREÇÃO", aviso:"AVISO" };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("edicoes").innerHTML = EDICOES.length ? EDICOES.map(e => `
  <div class="edicao">
    <h2>Semana de ${esc(e.semana)}</h2>
    <div class="periodo">Publicado em ${esc(e.publicado)}</div>
    <p class="resumo">${esc(e.resumo)}</p>
    ${e.itens.length ? e.itens.map(i => `
      <div class="item ${i.tipo}">
        <div class="tit"><span class="tag ${i.tipo}">${ROTULO[i.tipo]||""}</span>${esc(i.titulo)}</div>
        <div class="onde">${esc(i.onde)}</div>
        <p>${esc(i.texto)}</p>
      </div>`).join("") : '<div class="vazio">Nenhuma mudança visível no painel nesta semana; só a atualização diária dos números.</div>'}
  </div>`).join("") : '<div class="vazio">Nenhuma edição ainda.</div>';
</script>
</body></html>
