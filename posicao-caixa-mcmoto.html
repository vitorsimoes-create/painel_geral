<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Posição de Caixa — MC MOTO</title>
<style>
  * { box-sizing:border-box; }
  body { font-family:Arial,Helvetica,sans-serif; background:#f2f4f7; margin:0; padding:20px; color:#222; }

</div>

const LS_SALDO = 'caixa_saldo_mcmoto';
let DIAS = 30;

function fmt(n){ return 'R$ ' + Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtCurto(n){
  const a = Math.abs(n||0);
  if(a >= 1000) return (n<0?'-':'') + 'R$ ' + (a/1000).toFixed(1).replace('.',',') + 'k';
  return fmt(n);
}
function fmtData(iso){ return iso ? iso.split('-').reverse().join('/') : '—'; }
function gDia(iso){ return new Date(iso + 'T12:00:00').getDay(); }
function diaSemana(iso){ return ['dom','seg','ter','qua','qui','sex','sáb'][gDia(iso)]; }
/* Mesma regra do gerador: cartao cai em D+1, mas so em dia util. */
function diaUtilSeguinte(iso){
  let d = iso, g = gDia(d);
  while(g === 0 || g === 6){ d = somaDias(d, 1); g = gDia(d); }
  return d;
}
function somaDias(iso, n){
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0,10);
}

function saldos(){ try{ return JSON.parse(localStorage.getItem(LS_SALDO) || '{}'); }catch(e){ return {}; } }
function saldoInicial(){ const v = saldos().v; return v == null ? 0 : +v; }
function setSaldoInicial(v){
  const s = saldos();
  if(v === '') delete s.v; else s.v = +v;
  localStorage.setItem(LS_SALDO, JSON.stringify(s));
  renderizar();
}
function setDias(n){
  DIAS = n;
  Array.prototype.forEach.call(document.querySelectorAll('.modo-btn'), function(b){
    b.classList.toggle('ativo', +b.dataset.dias === n);
  });
  renderizar();
}

/* Venda prevista de um dia: media daquele dia da semana, menos a fatia a prazo
   (essa ja esta contada como titulo em contas a receber, pelo vencimento).
   Devolve as duas metades separadas, porque o cartao anda um dia a frente. */
function previsaoDia(iso){
  const media = D.mediaSemana[String(gDia(iso))] || 0;
  if(!media) return {cartao:0, avista:0};
  return {cartao: media * (D.mix.cartao || 0), avista: media * (D.mix.avista || 0)};
}

function serie(){
  const fim = somaDias(D.hoje, DIAS), dias = {};
  const usaPrev = document.getElementById('chk-prev').checked;
  function reg(iso){
    return dias[iso] || (dias[iso] = {cartao:0, prev:0, receber:0, sai:0});
  }
  // esqueleto: um registro por dia do horizonte
  for(let iso = D.hoje; iso <= fim; iso = somaDias(iso, 1)) reg(iso);

  // cartao REAL ja vendido, caindo em D+1
  Object.keys(D.cartaoACair).forEach(function(iso){
    if(iso >= D.hoje && iso <= fim) reg(iso).cartao += D.cartaoACair[iso];
  });
  // titulos a receber e a pagar, pelo vencimento
  Object.keys(D.receber).forEach(function(iso){
    if(iso >= D.hoje && iso <= fim) reg(iso).receber += D.receber[iso];
  });
  Object.keys(D.pagar).forEach(function(iso){
    if(iso >= D.hoje && iso <= fim) reg(iso).sai += D.pagar[iso];
  });
  /* Venda prevista. Comeca AMANHA: hoje o cartao que cai e o de ontem, que ja
     esta acima como numero real — somar previsao hoje seria contar duas vezes.
     A metade "cartao" da previsao de um dia cai no dia seguinte (regra D+1). */
  if(usaPrev){
    for(let iso = somaDias(D.hoje, 1); iso <= fim; iso = somaDias(iso, 1)){
      const p = previsaoDia(iso);
      reg(iso).prev += p.avista;
      const caixaCartao = diaUtilSeguinte(somaDias(iso, 1));
      if(caixaCartao <= fim) reg(caixaCartao).prev += p.cartao;
    }
  }
  if(document.getElementById('chk-atraso').checked){
    const r = reg(D.hoje);
    r.receber += D.atrasoReceber;
    r.sai += D.atrasoPagar;
  }
  let saldo = saldoInicial();
  return Object.keys(dias).sort().map(function(iso){
    const d = dias[iso];
    d.iso = iso;
    d.entra = d.cartao + d.prev + d.receber;
    d.liquido = d.entra - d.sai;
    saldo += d.liquido;
    d.saldo = saldo;
    return d;
  });
}

function renderMix(){
  const rot = {cartao:'Cartão', avista:'À vista (dinheiro/PIX)', aprazo:'A prazo (vira título)'};
  document.getElementById('mix').innerHTML = ['cartao','avista','aprazo'].map(function(k){
    return '<div class="fatia ' + k + '">' + rot[k] +
      '<b>' + ((D.mix[k]||0)*100).toFixed(0) + '% · ' + fmt((D.mix[k]||0) * D.vendaMix) + '</b></div>';
  }).join('') + '<div class="fatia">Venda dos últimos ' + D.diasMix + ' dias<b>' + fmt(D.vendaMix) + '</b></div>';
}

function renderKpis(linhas){
  const entra = linhas.reduce(function(s,d){ return s + d.entra; }, 0);
  const sai = linhas.reduce(function(s,d){ return s + d.sai; }, 0);
  const fim = linhas.length ? linhas[linhas.length-1].saldo : saldoInicial();
  const pior = linhas.reduce(function(m,d){ return d.saldo < m.saldo ? d : m; },
                             {saldo: saldoInicial(), iso: D.hoje});
  document.getElementById('kpis').innerHTML =
    '<div class="card"><label>Saldo inicial (hoje)</label><div class="calc">' + fmt(saldoInicial()) + '</div></div>' +
    '<div class="card entra"><label>Entradas em ' + DIAS + ' dias</label><div class="calc">' + fmt(entra) + '</div></div>' +
    '<div class="card sai"><label>Saídas em ' + DIAS + ' dias</label><div class="calc">' + fmt(sai) + '</div></div>' +
    '<div class="card' + (fim<0?' neg':'') + '"><label>Saldo em ' + DIAS + ' dias</label><div class="calc">' + fmt(fim) + '</div></div>' +
    '<div class="card' + (pior.saldo<0?' neg':'') + '"><label>Pior dia (' + fmtData(pior.iso) + ')</label><div class="calc">' + fmt(pior.saldo) + '</div></div>';
}

function renderGrafico(linhas){
  const alvo = document.getElementById('graf');
  if(!linhas.length){ alvo.innerHTML = '<div class="sem-dados">Nada previsto no período.</div>'; return; }
  let teto = 0;
  linhas.forEach(function(d){ if(Math.abs(d.saldo) > teto) teto = Math.abs(d.saldo); });
  if(!teto) teto = 1;
  alvo.innerHTML = linhas.map(function(d){
    const pct = Math.abs(d.saldo) / teto * 50;
    const cor = d.saldo < 0 ? '#c00000' : '#0a7a25';
    return '<div class="gbar"><div class="glabel">' + fmtData(d.iso).slice(0,5) + ' ' + diaSemana(d.iso) + '</div>' +
      '<div class="gtrack"><div class="gzero"></div>' +
      '<div class="gfill ' + (d.saldo<0?'negf':'pos') + '" style="width:' + pct + '%"></div></div>' +
      '<div class="gval" style="color:' + cor + '">' + fmtCurto(d.saldo) + '</div></div>';
  }).join('');
}

function renderTabela(linhas){
  document.querySelector('#tabela thead').innerHTML =
    '<tr><th>Data</th><th>Cartão (D+1)</th><th>Venda prevista</th><th>A receber</th>' +
    '<th>Entradas</th><th>Saídas</th><th>Líquido do dia</th><th>Saldo acumulado</th></tr>';
  const tbody = document.querySelector('#tabela tbody');
  if(!linhas.length){
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#888">Nada previsto no período.</td></tr>';
    return;
  }
  function cel(v, cls){
    if(!v) return '<td class="zero">—</td>';
    return '<td' + (cls ? ' class="' + cls + '"' : '') + '>' + fmt(v) + '</td>';
  }
  tbody.innerHTML = linhas.map(function(d){
    const cls = (d.iso === D.hoje) ? 'hoje' : (gDia(d.iso) === 0 ? 'fds' : '');
    return '<tr class="' + cls + '"><td>' + fmtData(d.iso) +
      ' <span style="color:#94a3b8">' + diaSemana(d.iso) + '</span></td>' +
      cel(d.cartao) + cel(d.prev, 'prev') + cel(d.receber) + cel(d.entra) + cel(d.sai, 'neg') +
      '<td' + (d.liquido<0?' class="neg"':'') + '>' +
      (d.liquido ? fmt(d.liquido) : '<span style="color:#cbd5e1">—</span>') + '</td>' +
      '<td' + (d.saldo<0?' class="neg"':'') + '><b>' + fmt(d.saldo) + '</b></td></tr>';
  }).join('');
}

function renderAviso(){
  const parc = D.formas.filter(function(f){ return /PARCELAD/i.test(f[0]); })
                       .reduce(function(s,f){ return s + f[1]; }, 0);
  document.getElementById('aviso').innerHTML =
    '<b>O que você precisa saber antes de decidir por esta tela.</b><br>' +
    '• A coluna <b style="color:#7c3aed">Venda prevista</b> é <b>estimativa</b>, não contrato: é a média de venda ' +
      'daquele dia da semana nos últimos ' + D.diasMedia + ' dias, já sem a fatia a prazo (que aparece em “a receber”). ' +
      'Sem ela a tela mostraria só as contas a pagar, porque ' + (((D.mix.cartao||0)+(D.mix.avista||0))*100).toFixed(0) +
      '% da venda é à vista e nunca vira título. Desmarque a caixa para ver só o que já está fechado.<br>' +
    '• <b>' + fmt(parc) + '</b> dos últimos ' + D.diasMix + ' dias saiu em <b>cartão parcelado</b>. A regra em vigor joga ' +
      'todo cartão para D+1, o que só é verdade se a maquininha antecipar. Se não antecipa, esse dinheiro pinga em ' +
      'parcelas mensais e a projeção de curto prazo está otimista nesse pedaço.<br>' +
    '• <b>Vencidos, fora da projeção:</b> ' + fmt(D.atrasoReceber) + ' a receber e ' + fmt(D.atrasoPagar) + ' a pagar. ' +
      'Data vencida não é previsão; marque <i>“jogar os vencidos para hoje”</i> para vê-los somados ao primeiro dia.';
}

function renderizar(){
  const linhas = serie();
  renderMix();
  renderKpis(linhas);
  renderGrafico(linhas);
  renderTabela(linhas);
  renderAviso();
  document.getElementById('sub').textContent =
    'Gerado em ' + D.geradoEm + ' · posição de ' + fmtData(D.hoje) + ' · projeção de ' + DIAS + ' dias' +
    (document.getElementById('chk-prev').checked ? ' · com venda prevista' : ' · só títulos');
}

document.getElementById('saldo-ini').addEventListener('change', function(){ setSaldoInicial(this.value); });
document.getElementById('saldo-ini').value = (saldos().v == null ? '' : saldos().v);
document.getElementById('nota').innerHTML =
  '<b>Como a conta é feita:</b> saldo inicial + cartão caindo em D+1 + venda prevista + títulos a receber do dia ' +
  '− títulos a pagar do dia, acumulado. O saldo inicial é digitado por você e fica salvo <b>neste navegador</b> — ' +
  'o ERP não tem um saldo bancário confiável para puxar automaticamente.<br>' +
  '<b>Cartão é D+1:</b> a venda no cartão de um dia entra no caixa no dia seguinte. Hoje esse número é real ' +
  '(veio da venda de ontem, por forma de pagamento); de amanhã em diante ele vem junto da previsão. ' +
  'Como banco não credita fim de semana, o cartão de sexta e o de sábado caem juntos na segunda.<br>' +
  '<b>Domingo</b> aparece zerado porque a loja não abre — a média por dia da semana já cuida disso, e sábado ' +
  'entra com o peso menor que ele tem de verdade.';
renderizar();
</script></body></html>
