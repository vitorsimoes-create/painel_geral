0":"DOUGLAS RODRIGO DE OLIVEIRA 57","33307519":"EVANDRO CALHEIROS NETO","33307608":"PRIMOS MOTOS","33307626":"MOTOSFERA","33307788":"MARCOS MELLO DE BRITTES JUNIOR","33307804":"MOBILLITE","33307868":"TOTAL MOTOS","33307902":"WELBER DUMONT DA CRUZ 18.317.9","33307957":"SEBASTIAO NEVES DE OLIVEIRA","33308082":"CASA MOACIR LAGE LTDA","33308117":"KAWAN GABRIEL COSTA CANDEIAS","33308206":"ISABELLA THAIS ROSA DE ABREU 6","33308224":"THALES LISBOA FERRAZ 21.955.98","33308545":"ANISIO JOSE DOS SANTPS","33308554":"KENIA GONCALVES PEREIRA","33308581":"CLEZERO RODRIGUES DOS SANTOS","33308634":"JOSIANE PEREIRA DA COSTA SOUZA","33308643":"TRIUNFO MOTOS","33308723":"CASTELO MOTOS","33308849":"VALDENIO FERREIRA DUTRA","33308974":"TAINARA FERRAZ DE OLIVEIRA","33309198":"BRASVILA","43307108":"GOLD MOTOS"},"geradoEm":"07/08/2026 08:48"};
const DADOS = {
  unidades: BRUTO.unidades, geradoEm: BRUTO.geradoEm,
  abertos: BRUTO.abertos.map(t=>({u:t[0], ent:t[1], venc:t[2], saldo:t[3]})),
  pagos: BRUTO.pagos.map(t=>({u:t[0], ent:t[1], data:t[2], valor:t[3]})),
};
function nomeCli(id){ return BRUTO.clientes[String(id)]||('Cliente '+id); }

function fmt(n){ return 'R$ ' + Number(n).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtData(iso){ return iso ? iso.split('-').reverse().join('/') : '—'; }
function hojeISO(){ return new Date().toISOString().slice(0,10); }
function classifica(vencISO, hoje, mais30){
  if(vencISO < hoje) return 'vencida';
  if(vencISO < mais30) return 'ate30';
  return 'futura';
}
let modoAtual='aberto';
function setModo(m){
  modoAtual=m;
  document.getElementById('modo-aberto').classList.toggle('ativo', m==='aberto');
  document.getElementById('modo-pago').classList.toggle('ativo', m==='pago');
  renderizar();
}
function unidadesSelecionadas(){
  return Array.from(document.querySelectorAll('.filtro-unidade:checked')).map(el=>parseInt(el.value));
}
function montaFiltro(){
  const div=document.getElementById('filtro-unidades');
  DADOS.unidades.forEach(u=>{
    const label=document.createElement('label');
    label.innerHTML='<input type="checkbox" class="filtro-unidade" value="'+u+'" checked> Unidade '+u;
    div.appendChild(label);
  });
  div.addEventListener('change', renderizar);
}
function renderKpisAging(titulos, hoje, mais30){
  let tot=0, venc=0, a30=0, fut=0;
  const porMes={};
  titulos.forEach(t=>{
    tot+=t.saldo;
    const cls=classifica(t.venc, hoje, mais30);
    if(cls==='vencida'){ venc+=t.saldo; porMes['Vencidas']=(porMes['Vencidas']||0)+t.saldo; }
    else{
      if(cls==='ate30') a30+=t.saldo; else fut+=t.saldo;
      const mk=t.venc.slice(0,7);
      porMes[mk]=(porMes[mk]||0)+t.saldo;
    }
  });
  document.getElementById('kpis').innerHTML=
    '<div class="card"><label>Total em aberto</label><div class="calc">'+fmt(tot)+'</div></div>'+
    '<div class="card vencida"><label>Vencidas</label><div class="calc">'+fmt(venc)+'</div></div>'+
    '<div class="card ate30"><label>Vencem em 30 dias</label><div class="calc">'+fmt(a30)+'</div></div>'+
    '<div class="card futura"><label>Futuras (&gt;30 dias)</label><div class="calc">'+fmt(fut)+'</div></div>';
  renderBarras(porMes, true);
}
function renderKpisPago(titulos, rotuloEntidade){
  const tot=titulos.reduce((s,t)=>s+t.valor,0);
  const entidades=new Set(titulos.map(t=>t.ent)).size;
  const porMes={};
  titulos.forEach(t=>{ const mk=t.data.slice(0,7); porMes[mk]=(porMes[mk]||0)+t.valor; });
  document.getElementById('kpis').innerHTML=
    '<div class="card pago"><label>Total quitado (12 meses)</label><div class="calc">'+fmt(tot)+'</div></div>'+
    '<div class="card"><label>Títulos quitados</label><div class="calc">'+titulos.length.toLocaleString('pt-BR')+'</div></div>'+
    '<div class="card"><label>'+rotuloEntidade+'</label><div class="calc">'+entidades+'</div></div>';
  renderBarras(porMes, false);
}
function renderBarras(porMes, comVencidas){
  const meses=Object.keys(porMes).filter(k=>k!=='Vencidas').sort();
  const tetoData=new Date(); tetoData.setMonth(tetoData.getMonth()+12);
  const teto=tetoData.toISOString().slice(0,7);
  const limite=meses.filter(k=>k<=teto).slice(0,13);
  const apos=meses.filter(k=>!limite.includes(k)).reduce((s,k)=>s+porMes[k],0);
  const barras=[];
  if(comVencidas && porMes['Vencidas']) barras.push(['Vencidas', porMes['Vencidas'], true]);
  limite.forEach(k=>{ const [a,m]=k.split('-'); barras.push([m+'/'+a.slice(2), porMes[k], false]); });
  if(apos>0) barras.push(['Após 12m', apos, false]);
  const max=Math.max(...barras.map(b=>b[1]), 1);
  document.getElementById('grafico-barras').innerHTML=barras.map(([lbl,val,isVenc])=>
    '<div class="gbar'+(isVenc?' vencida':'')+'"><div class="glabel">'+lbl+'</div>'+
    '<div class="gtrack"><div class="gfill" style="width:'+Math.max(2,Math.round(val/max*100))+'%"></div></div>'+
    '<div class="gval">'+fmt(val)+'</div></div>'
  ).join('');
}

function renderizar(){
  const uns=unidadesSelecionadas();
  document.getElementById('gerado-em').textContent='Gerado em '+DADOS.geradoEm+' · Unidade(s): '+(uns.length?uns.join(', '):'(nenhuma selecionada)');
  const det=document.getElementById('detalhe');
  const nota=document.getElementById('nota-rodape');
  if(uns.length===0){ document.getElementById('kpis').innerHTML=''; document.getElementById('grafico-barras').innerHTML=''; det.innerHTML='<div class="sem-dados">Selecione ao menos uma unidade de negócio.</div>'; nota.textContent=''; return; }
  const hoje=hojeISO();
  const mais30=new Date(Date.now()+30*86400000).toISOString().slice(0,10);

  if(modoAtual==='aberto'){
    document.getElementById('titulo-grafico').textContent='Saldo a receber por mês de vencimento';
    const titulos=DADOS.abertos.filter(t=>uns.includes(t.u));
    renderKpisAging(titulos, hoje, mais30);
    const porCli={};
    titulos.forEach(t=>{
      const c=porCli[t.ent]=porCli[t.ent]||{ent:t.ent,venc:0,a30:0,fut:0,tot:0,maiorAtraso:0,nTit:0};
      const cls=classifica(t.venc,hoje,mais30);
      c.tot+=t.saldo; c.nTit++;
      if(cls==='vencida'){
        c.venc+=t.saldo;
        const dias=Math.round((new Date(hoje)-new Date(t.venc))/86400000);
        if(dias>c.maiorAtraso) c.maiorAtraso=dias;
      }else if(cls==='ate30') c.a30+=t.saldo; else c.fut+=t.saldo;
    });
    const linhas=Object.values(porCli).sort((a,b)=>b.venc-a.venc||b.tot-a.tot);
    const rows=linhas.map(c=>'<tr class="'+(c.venc>0?'vencida':'')+'">'+
      '<td>'+nomeCli(c.ent)+' <span style="color:#94a3b8;font-size:10px">(#'+c.ent+')</span></td>'+
      '<td>'+c.nTit+'</td>'+
      '<td style="'+(c.venc>0?'color:#c00000;font-weight:bold':'')+'">'+fmt(c.venc)+'</td>'+
      '<td>'+(c.maiorAtraso>0?'<b>'+c.maiorAtraso+' d</b>':'—')+'</td>'+
      '<td>'+fmt(c.a30)+'</td>'+
      '<td>'+fmt(c.fut)+'</td>'+
      '<td><b>'+fmt(c.tot)+'</b></td></tr>').join('');
    det.innerHTML='<div class="tabela-wrap"><table><thead><tr><th>Cliente</th><th>Títulos</th><th>Vencido</th><th>Maior atraso</th><th>Vence em 30d</th><th>Futuro</th><th>Total em aberto</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    nota.textContent='Mostrando '+linhas.length+' cliente(s) com saldo em aberto (saldo líquido de recebimentos parciais), ordenados pelo maior valor vencido. A classificação é recalculada contra a data em que você está vendo a página.';
  }else{
    document.getElementById('titulo-grafico').textContent='Valor recebido por mês (últimos 12 meses)';
    const titulos=DADOS.pagos.filter(t=>uns.includes(t.u));
    renderKpisPago(titulos, 'Clientes');
    const porCli={};
    titulos.forEach(t=>{
      const c=porCli[t.ent]=porCli[t.ent]||{ent:t.ent,tot:0,n:0,ultimo:''};
      c.tot+=t.valor; c.n++;
      if(t.data>c.ultimo) c.ultimo=t.data;
    });
    const linhas=Object.values(porCli).sort((a,b)=>b.tot-a.tot);
    const rows=linhas.map(c=>'<tr>'+
      '<td>'+nomeCli(c.ent)+' <span style="color:#94a3b8;font-size:10px">(#'+c.ent+')</span></td>'+
      '<td>'+c.n+'</td><td>'+fmtData(c.ultimo)+'</td><td><b>'+fmt(c.tot)+'</b></td></tr>').join('');
    det.innerHTML='<div class="tabela-wrap"><table><thead><tr><th>Cliente</th><th>Títulos recebidos</th><th>Último recebimento</th><th>Total recebido (12m)</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    nota.textContent='Títulos recebidos/quitados (situação LQ) com baixa nos últimos 12 meses, ordenados por total recebido.';
  }
}

montaFiltro();
renderizar();
</script>
