D.linhas.forEach(r=>{ r.v=r.v||[]; r.vn=VEND[r.v[0]]||'—'; r.cn=CID[r.ci]||'—'; });
const LS_V='clientes_vend_'+D.empresa, LS_C='clientes_cid_'+D.empresa;
function lsLer(k){ try{ return new Set(JSON.parse(localStorage.getItem(k)||'[]')); }catch(e){ return new Set(); } }
function lsGravar(k,set){ try{ localStorage.setItem(k,JSON.stringify([...set])); }catch(e){} }
let vSel=new Set([...lsLer(LS_V)].filter(n=>VEND.indexOf(n)>=0));
let cSel=new Set([...lsLer(LS_C)].filter(n=>CID.indexOf(n)>=0));
function modoV(){ const e=document.getElementById('vmodo'); return e?e.value:'principal'; }
function vendOk(r){
  if(!vSel.size) return true;
  if(modoV()==='qualquer') return r.v.some(i=>vSel.has(VEND[i]));
  return vSel.has(r.vn);
}
function renderVChips(){
  const n={}; D.linhas.forEach(r=>{ n[r.vn]=(n[r.vn]||0)+1; });
  const ord=VEND.slice().sort((a,b)=>(n[b]||0)-(n[a]||0)||a.localeCompare(b));
  document.getElementById('vchips').innerHTML=
    '<button class="btn mini'+(vSel.size?'':' ativo')+'" onclick="limparVend()">Todos</button> '+
    ord.map(v=>'<button class="btn mini'+(vSel.has(v)?' ativo':'')+'" data-v="'+esc(v)+'" onclick="toggleVend(this.dataset.v)" '+
      'title="'+(n[v]||0)+' clientes na carteira">'+esc(v)+'</button>').join(' ');
}
function toggleVend(v){ if(vSel.has(v)) vSel.delete(v); else vSel.add(v); lsGravar(LS_V,vSel); renderVChips(); render(); }
function limparVend(){ vSel.clear(); lsGravar(LS_V,vSel); renderVChips(); render(); }
function abrirCid(ev){ ev.stopPropagation(); const d=document.getElementById('ddc'); d.classList.toggle('aberto');
  if(d.classList.contains('aberto')){ listaCid(); document.getElementById('cbusca').focus(); } }
document.addEventListener('click',()=>{ const d=document.getElementById('ddc'); if(d) d.classList.remove('aberto'); });
function listaCid(){
  const q=(document.getElementById('cbusca').value||'').trim().toUpperCase();
  const n={}; D.linhas.forEach(r=>{ n[r.cn]=(n[r.cn]||0)+1; });
  const ord=CID.filter(c=>!q||c.toUpperCase().indexOf(q)>=0).sort((a,b)=>(n[b]||0)-(n[a]||0)||a.localeCompare(b));
  document.getElementById('clista').innerHTML=ord.map(c=>'<label><input type="checkbox" data-c="'+esc(c)+'"'+
    (cSel.has(c)?' checked':'')+' onchange="toggleCid(this.dataset.c)">'+esc(c)+'<small>'+(n[c]||0)+'</small></label>').join('')
    || '<div style="color:#94a3b8;font-size:12px;padding:6px">Nenhuma cidade.</div>';
}
function toggleCid(c){ if(cSel.has(c)) cSel.delete(c); else cSel.add(c); lsGravar(LS_C,cSel); renderCidTags(); listaCid(); render(); }
function limparCid(){ cSel.clear(); lsGravar(LS_C,cSel); listaCid(); renderCidTags(); render(); }
function renderCidTags(){
  const b=document.getElementById('cbtn');
  b.innerHTML=(cSel.size?cSel.size+(cSel.size>1?' cidades':' cidade'):'Todas')+' &#9662;';
  b.classList.toggle('ativo',cSel.size>0);
  document.getElementById('ctags').innerHTML=[...cSel].map(c=>'<span class="tag" style="background:#ccfbf1;color:#0f766e;cursor:pointer" '+
    'data-c="'+esc(c)+'" onclick="toggleCid(this.dataset.c)" title="tirar do filtro">'+esc(c)+' &#10005;</span>').join('');
}
function toggleCli(cod){ abertoCli = (abertoCli===cod) ? null : cod; render(); }
/* Linha expandida com os 30 itens que o cliente mais compra (por valor). */
function linhaItens(cod){
  const lst=(D.itens||{})[cod]||[];
  if(!lst.length) return '<tr><td colspan="12" class="itens" style="color:#94a3b8">Sem itens registrados para este cliente.</td></tr>';
  const tot=lst.reduce((s,i)=>s+i[2],0);
  return '<tr><td colspan="12" class="itens"><table>'+
   '<thead><tr><th style="text-align:left">Cód.</th><th style="text-align:left">Produto</th>'+
   '<th style="text-align:right">Qtd</th><th style="text-align:right">Valor</th><th style="text-align:right">% do cliente</th></tr></thead><tbody>'+
   lst.map(i=>'<tr><td style="text-align:left;color:#94a3b8">'+esc(i[0])+'</td>'+
     '<td style="text-align:left">'+esc((D.nomes||{})[i[0]]||'—')+'</td>'+
     '<td>'+i[1].toLocaleString('pt-BR')+'</td><td>'+fmt(i[2])+'</td>'+
     '<td>'+(tot>0?(i[2]/tot*100).toFixed(1).replace('.',','):'0')+'%</td></tr>').join('')+
   '</tbody></table><div style="font-size:10px;color:#94a3b8;padding:6px 2px">'+
   lst.length+' principais itens (24 meses, por valor) — somam '+fmt(tot)+'.</div></td></tr>';
}

function setFiltro(f){ filtro=f;
  document.querySelectorAll('[data-f]').forEach(b=>b.classList.toggle('ativo',b.dataset.f===f)); render(); }
function toggleClasse(c){ if(classes.has(c))classes.delete(c); else classes.add(c);
  document.querySelectorAll('[data-c]').forEach(b=>b.classList.toggle('ativo',classes.has(b.dataset.c))); render(); }
function toggleUni(u){ if(unSel.has(u))unSel.delete(u); else unSel.add(u);
  document.querySelectorAll('[data-u]').forEach(b=>b.classList.toggle('ativo',unSel.size===0||unSel.has(b.dataset.u))); render(); }
document.querySelectorAll('#tbl th').forEach(th=>th.onclick=()=>{
  const k=th.dataset.k; if(ordK===k) ordAsc=!ordAsc; else { ordK=k; ordAsc=(k==='nome'); } render(); });

function corte(){ const v=parseInt(document.getElementById('corte').value,10); return v>0?v:60; }

function filtrados(){
  const q=(document.getElementById('busca').value||'').trim().toUpperCase();
  const lim=corte();
  return D.linhas.filter(r=>{
    if(unSel.size && !(r.u||[]).some(u=>unSel.has(u))) return false;
    if(!vendOk(r)) return false;
    if(cSel.size && !cSel.has(r.cn)) return false;
    if(q && r.nome.toUpperCase().indexOf(q)<0 && String(r.cod).indexOf(q)<0) return false;
    if(classes.size && !classes.has(r.classe)) return false;
    if(filtro==='ativos'   && r.diasSem>lim) return false;
    if(filtro==='inativos' && r.diasSem<=lim) return false;
    if(filtro==='inad'     && !(r.vencido>0)) return false;
    return true;
  });
}

function render(){
  const lim=corte();
  const lst=filtrados().slice().sort((a,b)=>{
    const x=a[ordK], y=b[ordK];
    if(x===null||x===undefined) return 1;
    if(y===null||y===undefined) return -1;
    const c = (typeof x==='string') ? x.localeCompare(y) : x-y;
    return ordAsc?c:-c;
  });
  const inat=lst.filter(r=>r.diasSem>lim).length;
  const inad=lst.filter(r=>r.vencido>0);
  const rec=lst.filter(r=>r.recompra!==null);
  document.getElementById('kpis').innerHTML=
    '<div class="card"><label>Clientes na lista</label><div class="v">'+lst.length.toLocaleString('pt-BR')+'</div></div>'+
    '<div class="card"><label>Inativos (+'+lim+' dias)</label><div class="v">'+inat.toLocaleString('pt-BR')+
      ' <small style="font-size:11px;color:#888">'+(lst.length?Math.round(inat/lst.length*100):0)+'%</small></div></div>'+
    '<div class="card"><label>Inadimplentes</label><div class="v">'+inad.length.toLocaleString('pt-BR')+
      ' <small style="font-size:11px;color:#888">'+fmt(inad.reduce((s,r)=>s+r.vencido,0))+'</small></div></div>'+
    '<div class="card"><label>Recompra média</label><div class="v">'+
      (rec.length?Math.round(rec.reduce((s,r)=>s+r.recompra,0)/rec.length)+' dias':'—')+'</div></div>'+
    ['A','B','C'].map(c=>'<div class="card"><label>Classe '+c+'</label><div class="v">'+
      lst.filter(r=>r.classe===c).length.toLocaleString('pt-BR')+'</div></div>').join('');

  document.getElementById('body').innerHTML=lst.map(r=>{
    const cls={'A':'cA','B':'cB','C':'cC'}[r.classe]||'cS';
    const ab=abertoCli===r.cod;
    return '<tr class="cli'+(r.diasSem>lim?' inativo':'')+'" onclick="toggleCli(this.dataset.c)" data-c="'+r.cod+'">'+
     '<td style="width:14px;color:#0f766e">'+(ab?'▼':'▶')+'</td>'+
     '<td>'+esc(r.nome)+(r.u&&r.u.length?' <span style="color:#94a3b8;font-size:10px">un '+r.u.join('/')+'</span>':'')+'</td>'+
     '<td style="text-align:left">'+esc(r.vn)+(r.v.length>1?' <span style="color:#94a3b8;font-size:10px" title="'+
        esc(r.v.slice(1).map(i=>VEND[i]).join(', '))+'">+'+(r.v.length-1)+'</span>':'')+'</td>'+
     '<td style="text-align:left">'+esc(r.cn)+'</td>'+
     '<td>'+fmt(r.total)+'</td><td>'+r.compras+'</td>'+
     '<td>'+r.ultima.split('-').reverse().join('/')+'</td>'+
     '<td'+(r.diasSem>lim?' style="color:#c2410c;font-weight:700"':'')+'>'+r.diasSem+'</td>'+
     '<td>'+(r.recompra!==null?r.recompra+' d':'—')+'</td>'+
     '<td'+(r.vencido>0?' style="color:#dc2626;font-weight:700"':'')+'>'+(r.vencido>0?fmt(r.vencido):'—')+'</td>'+
     '<td>'+(r.atraso!==null?r.atraso.toFixed(1).replace('.',',')+' d':'—')+'</td>'+
     '<td><span class="tag '+cls+'">'+r.classe+'</span></td></tr>'+(ab?linhaItens(r.cod):'');
  }).join('') || '<tr><td colspan="12" style="text-align:center;color:#888;padding:20px">Nenhum cliente com esses filtros.</td></tr>';

  document.getElementById('ger').textContent='Gerado em '+D.geradoEm+' · '+D.linhas.length.toLocaleString('pt-BR')+
    ' clientes com compra nos últimos 24 meses · atualizado diariamente';
  document.getElementById('nota').innerHTML=
    '<b>Clique no cliente</b> para ver os 30 itens que ele mais compra. '+
    '<b>Vendedor</b>: o da carteira é quem mais vendeu para o cliente em 24 meses (o "+N" diz quantos outros também venderam; passe o mouse para ver). '+
    'Em "comprou com o vendedor" o cliente aparece em todos que já venderam para ele, então a soma entre vendedores repete cliente. '+
    '<b>Cidade</b>: a do cadastro do cliente. <b>Inativo</b>: mais de '+lim+' dias sem comprar (ajuste no campo acima). '+
    '<b>Recompra</b>: média de dias entre compras — conta dias distintos, então duas notas no mesmo dia são uma visita só; precisa de 2 compras ou mais. '+
    '<b>Inadimplente</b>: tem título vencido em aberto hoje. '+
    '<b>Classe</b> (comportamento de pagamento, não volume): '+
    '<span class="tag cA">A</span> sem vencido e atraso médio até 5 dias · '+
    '<span class="tag cB">B</span> sem vencido e atraso médio até 15 dias · '+
    '<span class="tag cC">C</span> tem vencido em aberto ou atraso médio acima de 15 dias · '+
    '<span class="tag cS">sem histórico</span> nunca teve título a prazo (venda à vista não gera título).';
}
renderVChips(); renderCidTags();
render();
</script></body></html>
