}
function setN(n){ N=n; localStorage.setItem(LS_N,n); render(); }

/* Calcula todas as linhas de um mes. Fluxo vem do banco; posicao vem do fechamento
   do dia 1 (mes fechado) ou da foto de hoje (mes corrente). */
function calc(ym, corrente){
  const f=fluxoMes(ym), a=aliq();
  const pos = posMes(ym, corrente);
  const vAv=f.vAvista||0, vAp=f.vAprazo||0, tot=vAv+vAp;
  const csll=tot*a.csll/100, irpj=tot*a.irpj/100, pis=tot*a.pis/100, cofins=tot*a.cofins/100;
  const impTot=csll+irpj+pis+cofins;
  const premio=v(ym,'premio'), despFin=v(ym,'despFin'), recFin=v(ym,'recFin');
  const mc=tot-(f.cmv||0)-(f.comissao||0)-premio-(f.frete||0)-impTot;
  const fixo=fixoMes(ym);
  const resultado=mc-fixo-despFin+recFin;
  const capital=v(ym,'capital'), imob=v(ym,'imobilizado');
  const caixa = v(ym,'caixa');
  const ativos=(pos.estoque||0)+(pos.aReceber||0)+caixa+imob;
  const passivo=(pos.aPagar||0);
  return {vAv:vAv, vAp:vAp, tot:tot, cmv:f.cmv||0, comissao:f.comissao||0, premio:premio,
          frete:f.frete||0, csll:csll, irpj:irpj, pis:pis, cofins:cofins,
          mc:mc, fixo:fixo, despFin:despFin, recFin:recFin, resultado:resultado,
          resCap: capital>0?resultado/capital*100:null,
          estoque:pos.estoque||0, compras:f.compras||0, aPagar:passivo, aReceber:pos.aReceber||0,
          caixa:caixa, imob:imob, func:v(ym,'funcionarios'),
          diasUteis:D.diasUteis[ym]||0,
          vendaDia:(D.diasUteis[ym]||0)>0 ? tot/D.diasUteis[ym] : 0,
          inad:(pos.inadimplencia==null?null:pos.inadimplencia),
          itensEstoque:pos.itensEstoque||0, itensGirados:f.itensGirados||0,
          capital:capital, ativos:ativos, passivo:passivo, dif:ativos-passivo,
          temPos:pos.temPos, atrasado:pos.atrasado};
}

function render(){
  const todosMeses={};
  Object.keys(D.fluxo).forEach(function(u){ Object.keys(D.fluxo[u]).forEach(function(m){ todosMeses[m]=1; }); });
  const meses=Object.keys(todosMeses).sort().slice(-N).reverse();
  const hoje=D.hoje.slice(0,7);
  const dados=meses.map(m=>({ym:m, corrente:(m===hoje), c:calc(m,(m===hoje))}));

  document.getElementById('thead').innerHTML='<tr><th style="text-align:left;min-width:190px">Linha</th>'+
    dados.map(d=>'<th>'+rot(d.ym)+(d.corrente?'<span class="tagp">parcial</span>':'')+'</th>').join('')+'</tr>';

  function L(rotulo,get,op){
    op=op||{};
    return '<tr'+(op.cls?' class="'+op.cls+'"':'')+'><th>'+rotulo+'</th>'+
      dados.map(function(d){
        if(op.manual){
          const u=umaUnidade();
          if(!u){    // varias unidades: mostra a soma, sem edicao
            return '<td class="man" title="Selecione uma única unidade para editar">'+fmt(vMan(d.ym,op.manual))+'</td>';
          }
          const mm=manU(u)[d.ym]||{};
          const val=(mm[op.manual]==null?'':mm[op.manual]);
          return '<td class="man"><input type="number" step="0.01" value="'+val+
                 '" data-ym="'+d.ym+'" data-k="'+op.manual+'" onchange="setV(this.dataset.ym,this.dataset.k,this.value)"></td>';
        }
        const x=get(d.c);
        if(x===null||x===undefined) return '<td style="color:#cbd5e1">—</td>';
        const txt=(op.tipo==='num')?num(Math.round(x)):((op.tipo==='pct')?x.toFixed(1).replace('.',',')+'%':fmt(x));
        const cor=(op.cor&&x<0)?' class="neg"':((op.cor&&x>0)?' class="pos"':'');
        return '<td'+cor+(d.corrente?' style="opacity:.7"':'')+'>'+txt+'</td>';
      }).join('')+'</tr>';
  }

  document.getElementById('tbody').innerHTML=
    L('VENDAS À VISTA',function(c){return c.vAv})+
    L('VENDAS A PRAZO',function(c){return c.vAp})+
    L('VENDAS TOTAIS',function(c){return c.tot},{cls:'tot'})+
    L('CMV',function(c){return -c.cmv})+
    L('COMISSÃO',function(c){return -c.comissao})+
    L('PRÊMIO',null,{manual:'premio'})+
    L('FRETE VENDAS',function(c){return -c.frete})+
    L('CSLL',function(c){return -c.csll})+
    L('IRPJ',function(c){return -c.irpj})+
    L('PIS',function(c){return -c.pis})+
    L('COFINS',function(c){return -c.cofins})+
    L('MARGEM DE CONTRIBUIÇÃO',function(c){return c.mc},{cls:'tot',cor:1})+
    L('CUSTO FIXO',function(c){return -c.fixo})+
    L('DESPESA FINAN',null,{manual:'despFin'})+
    L('RECEITA FINANCEIRA',null,{manual:'recFin'})+
    L('RESULTADO',function(c){return c.resultado},{cls:'res'})+
    L('RESULTADO/CAPITAL',function(c){return c.resCap},{tipo:'pct'})+
    '<tr class="grupo"><th>POSIÇÃO</th>'+dados.map(function(d){
        if(d.corrente) return '<td>hoje</td>';
        if(!d.c.temPos) return '<td style="color:#cbd5e1">sem fechamento</td>';
        const at=d.c.atrasado;
        return '<td'+(at?' title="fechado em '+at.split('-').reverse().join('/')+', fora do dia 1º" style="color:#b45309"':'')+'>'+
               (at?'fech. '+at.slice(8)+'/'+at.slice(5,7):'fechado')+'</td>';
      }).join('')+'</tr>'+
    L('ESTOQUE',function(c){return c.estoque})+
    L('COMPRAS',function(c){return c.compras})+
    L('CONTAS A PAGAR',function(c){return c.aPagar})+
    L('CONTAS A RECEB',function(c){return c.aReceber})+
    L('CAIXA/BANCOS',null,{manual:'caixa'})+
    L('IMOBILIZADO',null,{manual:'imobilizado'})+
    L('FUNCIONÁRIOS LOJA',null,{manual:'funcionarios'})+
    L('DIAS ÚTEIS',function(c){return c.diasUteis},{tipo:'num'})+
    L('VENDA P/ DIA ÚTIL',function(c){return c.vendaDia})+
    L('INAD. GERAL',function(c){return c.inad},{tipo:'pct'})+
    L('ITENS NO ESTOQUE',function(c){return c.itensEstoque},{tipo:'num'})+
    L('ITENS GIRADOS',function(c){return c.itensGirados},{tipo:'num'})+
    L('CAPITAL SOCIAL',null,{manual:'capital'})+
    L('ATIVOS',function(c){return c.ativos},{cls:'tot'})+
    L('PASSIVO',function(c){return c.passivo},{cls:'tot'})+
    L('DIFERENÇA',function(c){return c.dif},{cls:'res'});

  // seletor de unidade (so aparece com mais de uma)
  if(D.unidades.length>1){
    const sel=unidades();
    document.getElementById('uni-box').style.display='flex';
    document.getElementById('uni-btns').innerHTML=D.unidades.map(function(u){
      return '<button class="btn" data-u="'+u[0]+'" onclick="toggleUni(this.dataset.u)"'+
        (sel.indexOf(u[0])>=0?' style="background:#1e293b;color:#fff;border-color:#1e293b"':'')+
        '>'+u[1]+'</button>';
    }).join('');
  }

  const a=aliq();
  document.getElementById('ger').textContent='Gerado em '+D.geradoEm+' · posição de hoje '+
    D.hoje.split('-').reverse().join('/')+' · fechamento automático todo dia 1º'+
    (D.unidades.length>1?' · '+rotUnidades():'');
  document.getElementById('nota').innerHTML=
    '<b>Fluxo</b> (vendas, CMV, compras, itens girados) vem do banco e não muda depois que o mês fecha. '+
    '<b>Posição</b> (estoque, contas, caixa, itens em estoque) é uma foto: o mês fechado usa o valor gravado no <b>dia 1º</b>, '+
    'antes de qualquer movimentação; o mês corrente mostra a posição de hoje e por isso aparece esmaecido. '+
    '<b>À vista</b> = PIX, dinheiro, débito e crédito à vista; <b>a prazo</b> = cartão parcelado, faturamento e crediário. '+
    'Impostos sobre a venda total: CSLL '+a.csll+'%, IRPJ '+a.irpj+'%, PIS '+a.pis+'%, COFINS '+a.cofins+'% — ajuste no botão "% Impostos". '+
    '<b>Margem de contribuição</b> = vendas − CMV − comissão − prêmio − frete − impostos. '+
    '<b>Resultado</b> = MC − custo fixo − despesa financeira + receita financeira. '+
    '<b>Ativos</b> = estoque + a receber + caixa + imobilizado; <b>Passivo</b> = contas a pagar. '+
    'Os campos amarelos ficam salvos <b>neste navegador</b>, <b>por unidade</b> — com mais de uma unidade marcada eles viram soma e não podem ser editados. '+
    'Use "Exportar lançamentos" para guardar uma cópia.'+
    (D.unidades.length>1?' Recorte atual: <b>'+rotUnidades()+'</b>.':'');
}

function repetirMesAnterior(){
  const tm={};
  Object.keys(D.fluxo).forEach(function(u){ Object.keys(D.fluxo[u]).forEach(function(m){ tm[m]=1; }); });
  const meses=Object.keys(tm).sort();
  const hoje=D.hoje.slice(0,7);
  const ant=meses[meses.indexOf(hoje)-1];
  if(!ant){ alert('Não há mês anterior.'); return; }
  const u=umaUnidade();
  if(!u){ alert('Selecione UMA unidade para copiar os lançamentos.'); return; }
  const m=man(); const mu=(m[u]=m[u]||{}); const base=mu[ant]||{};
  const estaveis=['imobilizado','funcionarios','capital'];
  mu[hoje]=Object.assign({},mu[hoje]||{});
  estaveis.forEach(function(k){ if(base[k]!=null) mu[hoje][k]=base[k]; });
  setMan(m); render();
  alert('Imobilizado, funcionários e capital social de '+rot(ant)+' copiados para '+rot(hoje)+'.');
}
function exportar(){
  const txt=JSON.stringify({empresa:EMP,aliquotas:aliq(),lancamentos:man()},null,1);
  navigator.clipboard.writeText(txt).then(
    function(){ alert('Lançamentos copiados. Guarde este texto — é a cópia de segurança do que você digitou.'); },
    function(){ prompt('Copie o texto:',txt); });
}
function salvarAliq(){
  const o={};
  ['csll','irpj','pis','cofins'].forEach(function(k){ o[k]=parseFloat(document.getElementById('al-'+k).value)||0; });
  localStorage.setItem(LS_ALIQ,JSON.stringify(o));
  document.getElementById('dlg').close(); render();
}
(function(){
  const a=aliq();
  document.getElementById('dlg-body').innerHTML=
    [['csll','CSLL'],['irpj','IRPJ'],['pis','PIS'],['cofins','COFINS']].map(function(p){
      return '<label>'+p[1]+'<span><input type="number" step="0.01" id="al-'+p[0]+'" value="'+a[p[0]]+'"> %</span></label>';
    }).join('');
})();
render();
</script></body></html>
