function fmt(n){ return 'R$ ' + Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtCurto(n){
  const a = Math.abs(n||0);
  if(a >= 1000) return (n<0?'-':'') + 'R$ ' + (a/1000).toFixed(1).replace('.',',') + 'k';
  return fmt(n);
}
function fmtData(iso){ return iso ? iso.split('-').reverse().join('/') : '—'; }
function diaSemana(iso){
  return ['dom','seg','ter','qua','qui','sex','sáb'][new Date(iso + 'T12:00:00').getDay()];
}
function ehFimDeSemana(iso){

  return g === 0 || g === 6;
}
function somaDias(iso, n){
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0,10);
}

}

/* O saldo inicial e por RECORTE de unidades: o saldo de "3+5" nao e o de "5". */
function chaveSaldo(){ return unidades().slice().sort().join('+') || '-'; }
function saldos(){ try{ return JSON.parse(localStorage.getItem(LS_SALDO) || '{}'); }catch(e){ return {}; } }
function saldoInicial(){ const v = saldos()[chaveSaldo()]; return v == null ? 0 : +v; }

  const s = saldos();
  if(v === '') delete s[chaveSaldo()]; else s[chaveSaldo()] = +v;
  localStorage.setItem(LS_SALDO, JSON.stringify(s));

}

/* Serie diaria do recorte atual: entra, sai, liquido e saldo acumulado. */
function serie(){
  const uns = unidades(), fim = somaDias(D.hoje, DIAS), dias = {};
  function reg(iso){
    return dias[iso] || (dias[iso] = {cartao:0, pix:0, boleto:0, outros:0, entra:0, sai:0});
  }
  uns.forEach(function(u){
    const e = D.entradas[u] || {};
    Object.keys(e).forEach(function(iso){
      if(iso < D.hoje || iso > fim) return;
      const r = reg(iso);
      Object.keys(e[iso]).forEach(function(cat){ r[cat] += e[iso][cat]; r.entra += e[iso][cat]; });
    });
    const s = D.saidas[u] || {};
    Object.keys(s).forEach(function(iso){
      if(iso < D.hoje || iso > fim) return;
      reg(iso).sai += s[iso];
    });
  });
  if(document.getElementById('chk-atraso').checked){
    const r = reg(D.hoje);
    uns.forEach(function(u){
      const a = D.atrasoReceber[u] || {};
      Object.keys(a).forEach(function(cat){ r[cat] += a[cat]; r.entra += a[cat]; });
      r.sai += (D.atrasoPagar[u] || 0);
    });
  }
  let saldo = saldoInicial();
  return Object.keys(dias).sort().map(function(iso){
    const d = dias[iso];
    d.iso = iso;
    d.liquido = d.entra - d.sai;
    saldo += d.liquido;
    d.saldo = saldo;
    return d;
  });
}

function totalAtraso(campo){

    if(typeof a === 'number') return s + a;
    return s + Object.keys(a).reduce(function(x, k){ return x + a[k]; }, 0);

}

function renderKpis(linhas){
  const entra = linhas.reduce(function(s, d){ return s + d.entra; }, 0);
  const sai = linhas.reduce(function(s, d){ return s + d.sai; }, 0);
  const fim = linhas.length ? linhas[linhas.length - 1].saldo : saldoInicial();
  const pior = linhas.reduce(function(m, d){ return d.saldo < m.saldo ? d : m; },
                             {saldo: saldoInicial(), iso: D.hoje});
  document.getElementById('kpis').innerHTML =
    '<div class="card"><label>Saldo inicial (hoje)</label><div class="calc">' + fmt(saldoInicial()) + '</div></div>' +
    '<div class="card entra"><label>Entradas em ' + DIAS + ' dias</label><div class="calc">' + fmt(entra) + '</div></div>' +
    '<div class="card sai"><label>Saídas em ' + DIAS + ' dias</label><div class="calc">' + fmt(sai) + '</div></div>' +
    '<div class="card' + (fim < 0 ? ' neg' : '') + '"><label>Saldo em ' + DIAS + ' dias</label><div class="calc">' + fmt(fim) + '</div></div>' +
    '<div class="card' + (pior.saldo < 0 ? ' neg' : '') + '"><label>Pior dia (' + fmtData(pior.iso) + ')</label><div class="calc">' + fmt(pior.saldo) + '</div></div>';
}

function renderGrafico(linhas){
  const alvo = document.getElementById('graf');
  if(!linhas.length){ alvo.innerHTML = '<div class="sem-dados">Nada previsto no período.</div>'; return; }
  let teto = 0;
  linhas.forEach(function(d){ if(Math.abs(d.saldo) > teto) teto = Math.abs(d.saldo); });
  if(!teto) teto = 1;
  alvo.innerHTML = linhas.map(function(d){
    const pct = Math.abs(d.saldo) / teto * 50;
    const cor = d.saldo < 0 ? '#c00000' : '#0a7a25';
    return '<div class="gbar"><div class="glabel">' + fmtData(d.iso).slice(0,5) + ' ' + diaSemana(d.iso) + '</div>' +
      '<div class="gtrack"><div class="gzero"></div>' +
      '<div class="gfill ' + (d.saldo < 0 ? 'negf' : 'pos') + '" style="width:' + pct + '%"></div></div>' +
      '<div class="gval" style="color:' + cor + '">' + fmtCurto(d.saldo) + '</div></div>';
  }).join('');
}

function renderTabela(linhas){
  const thead = document.querySelector('#tabela thead');
  const tbody = document.querySelector('#tabela tbody');
  thead.innerHTML = '<tr><th>Data</th>' +
    CATS.map(function(c){ return '<th>' + c[1] + '</th>'; }).join('') +
    '<th>Entradas</th><th>Saídas</th><th>Líquido do dia</th><th>Saldo acumulado</th></tr>';
  if(!linhas.length){
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#888">Nada previsto no período.</td></tr>';
    return;
  }
  function cel(v, neg){
    if(!v) return '<td class="zero">—</td>';
    return '<td' + (neg ? ' class="neg"' : '') + '>' + fmt(v) + '</td>';
  }
  tbody.innerHTML = linhas.map(function(d){
    const cls = (d.iso === D.hoje) ? 'hoje' : (ehFimDeSemana(d.iso) ? 'fds' : '');
    return '<tr class="' + cls + '"><td>' + fmtData(d.iso) +
      ' <span style="color:#94a3b8">' + diaSemana(d.iso) + '</span></td>' +
      CATS.map(function(c){ return cel(d[c[0]]); }).join('') +
      cel(d.entra) + cel(d.sai, true) +
      '<td' + (d.liquido < 0 ? ' class="neg"' : '') + '>' +
      (d.liquido ? fmt(d.liquido) : '<span style="color:#cbd5e1">—</span>') + '</td>' +
      '<td' + (d.saldo < 0 ? ' class="neg"' : '') + '><b>' + fmt(d.saldo) + '</b></td></tr>';
  }).join('');
}

/* Quanto da venda recente nao virou titulo: dinheiro + cartao nao lancado. */
function cobertura(){
  let venda = 0, tit = 0;
  unidades().forEach(function(u){
    venda += (D.venda[u] || 0);
    tit += (D.titulado[u] || 0);
  });
  const fora = Math.max(venda - tit, 0);
  return {venda: venda, fora: fora, pct: venda > 0 ? fora / venda * 100 : 0};
}

/* Cobranca em carteira (tipo CA) que a regra manda desconsiderar em contas a
   receber. Fora do cartao e, quase sempre, promissoria — divida real de cliente.
   Some da projecao, mas o numero continua visivel para o usuario decidir. */
function carteiraFora(){
  const por = {};
  let total = 0;
  unidades().forEach(function(u){
    const f = D.carteiraFora[u] || {};
    Object.keys(f).forEach(function(nome){ por[nome] = (por[nome] || 0) + f[nome]; total += f[nome]; });
  });
  const detalhe = Object.keys(por).sort(function(a, b){ return por[b] - por[a]; })
    .map(function(n){ return n + ' ' + fmt(por[n]); }).join(', ');
  return {total: total, detalhe: detalhe};
}

function renderAviso(){
  const c = cobertura();
  const vencR = totalAtraso('atrasoReceber'), vencP = totalAtraso('atrasoPagar');
  const cart = unidades().reduce(function(s, u){ return s + (D.cartaoJaCaiu[u] || 0); }, 0);
  const carteira = carteiraFora();
  document.getElementById('aviso').innerHTML =
    '<b>O que esta projeção não enxerga.</b><br>' +
    '• <b>' + fmt(c.fora) + '</b> dos últimos ' + D.diasVenda + ' dias de venda (' + c.pct.toFixed(0) +
      '% de ' + fmt(c.venda) + ') não gerou título nenhum. É dinheiro em espécie somado ao cartão que a loja ' +
      'deixou de lançar — não dá para separar um do outro, então nada disso entra na previsão.<br>' +
    '• <b>Vencidos, fora da projeção:</b> ' + fmt(vencR) + ' a receber e ' + fmt(vencP) + ' a pagar. ' +
      'Data vencida não é previsão; marque <i>"jogar os vencidos para hoje"</i> para vê-los somados ao primeiro dia.<br>' +
    '• <b>' + fmt(cart) + '</b> em títulos de cartão que, pela regra D+1, já deveriam ter caído há mais de um dia. ' +
      'O ERP nunca deu baixa neles; esse dinheiro já está na conta e por isso já faz parte do saldo inicial que você digita.' +
    (carteira.total ? '<br>• <b>' + fmt(carteira.total) + '</b> em cobrança na <b>carteira</b> (' + carteira.detalhe + ') ' +
      'ficaram de fora: a regra em vigor manda desconsiderar tudo que está com tipo de cobrança CA em contas a receber. ' +
      'Isso tirou o cartão, mas leva junto a promissória e o cheque, que são dívida real de cliente. ' +
      'Se quiser esse dinheiro dentro da projeção, é só pedir para separar cartão de carteira.' : '');
}

function renderizar(){
  const linhas = serie();
  renderKpis(linhas);
  renderGrafico(linhas);
  renderTabela(linhas);
  renderAviso();
  document.getElementById('sub').textContent =
    'Gerado em ' + D.geradoEm + ' · posição de ' + fmtData(D.hoje) +
    ' · projeção de ' + DIAS + ' dias · unidade(s) ' + (unidades().join(', ') || '—');
}

montaFiltro();
document.getElementById('filtro-unidades').addEventListener('change', function(){
  mostraSaldoSalvo();
  renderizar();
});
document.getElementById('saldo-ini').addEventListener('change', function(){ setSaldoInicial(this.value); });
mostraSaldoSalvo();
document.getElementById('nota').innerHTML =
  '<b>Como a conta é feita:</b> saldo inicial + títulos a receber que vencem no dia − títulos a pagar que vencem no dia, ' +
  'acumulado dia após dia. O saldo inicial é digitado por você e fica salvo <b>neste navegador</b>, por recorte de unidade — ' +
  'o ERP não tem um saldo bancário confiável para puxar automaticamente.<br>' +
  '<b>Cartão é D+1:</b> venda no cartão vira dinheiro no dia seguinte, então a data de caixa do título de cartão é a ' +
  '<b>emissão + 1 dia</b>, e não o vencimento gravado no ERP.<br>' +
  '<b>Atenção à linha do cartão:</b> as unidades 4 e 5 pararam de emitir título de cartão (ago e set/2025). Enquanto não ' +
  'voltarem a lançar, a coluna "Cartão (D+1)" fica zerada nelas e a venda no cartão some dentro do dinheiro. A unidade 3 lança normalmente.';
renderizar();
</script></body></html>
